<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다먹자 알림 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#1a1f2b; --ink-2:#565e70; --ink-3:#8b92a1;
  --line:#dfe3ea; --line-2:#b9c0cc; --box:#eef0f4; --shade:rgba(15,20,30,.35);
  --accent:#2f5bd3; --accent-bg:#e5ecfc;
  --ok:#1d7a4b; --ok-bg:#ddf1e5; --warn:#a46700; --warn-bg:#fbeecd; --bad:#c03232; --bad-bg:#fbe3e3;
  --n:#0f7a74; --n-bg:#dcf2ef; --p:#6a4bc4; --p-bg:#ebe5fa; --q:#b0601a; --q-bg:#fbeadb; --down:#2a2f3a;
  --s1:#2f5bd3; --s2:#0f7a74; --u1:#6a4bc4; --u2:#b0601a;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#1a1e26; --ink:#e8ebf1; --ink-2:#a8afbc; --ink-3:#6f7786; --shade:rgba(0,0,0,.55);
  --line:#2a303b; --line-2:#465061; --box:#232833; --accent:#83a2f2; --accent-bg:#1e2945;
  --ok:#6fd09c; --ok-bg:#163224; --warn:#ecc06c; --warn-bg:#3a2c0f; --bad:#f28b8b; --bad-bg:#3e1b1b;
  --n:#5fd0c6; --n-bg:#123230; --p:#b49cf5; --p-bg:#2a2245; --q:#f0a868; --q-bg:#3a2715; --down:#05070a;
  --s1:#83a2f2; --s2:#5fd0c6; --u1:#b49cf5; --u2:#f0a868; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#1a1e26; --ink:#e8ebf1; --ink-2:#a8afbc; --ink-3:#6f7786; --shade:rgba(0,0,0,.55);
  --line:#2a303b; --line-2:#465061; --box:#232833; --accent:#83a2f2; --accent-bg:#1e2945;
  --ok:#6fd09c; --ok-bg:#163224; --warn:#ecc06c; --warn-bg:#3a2c0f; --bad:#f28b8b; --bad-bg:#3e1b1b;
  --n:#5fd0c6; --n-bg:#123230; --p:#b49cf5; --p-bg:#2a2245; --q:#f0a868; --q-bg:#3a2715; --down:#05070a;
  --s1:#83a2f2; --s2:#5fd0c6; --u1:#b49cf5; --u2:#f0a868; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{word-break:keep-all;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ham{width:38px;height:38px;flex:none;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);cursor:pointer;display:grid;place-content:center;gap:4px;padding:0}
.ham i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
.ham:hover{background:var(--box)}
.brand{font-size:15px;font-weight:600;white-space:nowrap;margin-right:6px}
.scr{display:flex;gap:6px;flex-wrap:wrap}
.scr button{font:inherit;font-size:13.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.scr button:hover{background:var(--box)}
.scr button.legacy{border-style:dashed}
.scr button.sel{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:500}
button:focus-visible,select:focus-visible,ol.list li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shade{position:fixed;inset:0;z-index:9;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;z-index:10;top:0;left:0;bottom:0;width:min(330px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;padding:16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
body.open .shade{opacity:1;pointer-events:auto} body.open .drawer{transform:none}
.drawer .hd{font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 6px 8px}
.drawer button{font:inherit;text-align:left;border:1px solid transparent;background:none;color:var(--ink);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.drawer button:hover{background:var(--box)}
.drawer button.sel{background:var(--accent-bg);border-color:var(--accent)}
.drawer button b{font-size:14px;font-weight:600} .drawer button.sel b{color:var(--accent)}
.drawer button span{font-size:12px;color:var(--ink-2);line-height:1.5}
.drawer .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:8px 6px;line-height:1.6}
.wrap{max-width:none;margin:0 auto;padding:10px 16px 24px;display:flex;flex-direction:column;gap:10px}
.titlebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:16px;font-weight:600;margin:0 8px 0 0;white-space:nowrap}
.sp{flex:1}
.lede{font-size:13px;color:var(--ink-2);margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl label{font-size:13px;color:var(--ink-2)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
#sel{flex:1 1 320px;max-width:520px}
.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 16px;cursor:pointer}
.btn:hover{background:var(--box)} .btn:disabled{opacity:.4;cursor:default;background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);min-width:96px}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--box);color:var(--ink-2);white-space:nowrap}
.chip.code{background:var(--ok-bg);color:var(--ok)} .chip.risk{background:var(--bad-bg);color:var(--bad)} .chip.perf{background:var(--warn-bg);color:var(--warn)} .chip.sol{background:var(--q-bg);color:var(--q)} .chip.cls{background:var(--accent-bg);color:var(--accent)}
.now{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--accent-bg)}
.now .k{font-size:12px;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.ph{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--panel);color:var(--ink-2)}
.ph.p-norm{color:var(--ok)} .ph.p-prob{color:var(--bad)} .ph.p-obs{color:var(--warn)} .ph.p-fix{color:var(--q)} .ph.p-re{color:var(--accent)} .ph.p-sum{color:var(--ink-2)}
.now .c{font-size:17px;font-weight:600;color:var(--ink);text-wrap:balance}
.stepbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;border:1.5px solid var(--accent);background:var(--panel);min-height:120px}
.stepbox .who{font-size:12px;font-weight:600;color:var(--accent)}
.stepbox.idle{border-style:dashed;border-color:var(--line-2)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flow li{display:grid;grid-template-columns:18px 1fr;gap:4px;font-size:14px;line-height:1.55;color:var(--ink)}
.flow li::before{content:"→";color:var(--accent);font-weight:600}
.stepbox.idle .flow li{color:var(--ink-3)} .stepbox.idle .flow li::before{color:var(--ink-3)}
.abrow{display:flex;gap:8px;flex-wrap:wrap}
.abrow button{flex:1 1 120px;font:inherit;font-size:13.5px;text-align:left;border:1.5px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.abrow button b{font-weight:600} .abrow button span{font-size:12px;color:var(--ink-2)}
.abrow button.sel{border-color:var(--q);background:var(--q-bg)} .abrow button.sel b{color:var(--q)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.list li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13px;color:var(--ink-3);padding:6px 8px;border-radius:8px;cursor:pointer}
ol.list li b{font-weight:500;font-variant-numeric:tabular-nums}
ol.list li:hover{background:var(--box);color:var(--ink)}
ol.list li.done{color:var(--ink-2)}
ol.list li.on,ol.list li.on:hover{background:var(--accent-bg);color:var(--accent);font-weight:500}
ol.list li.sep{cursor:default;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:8px 8px 2px;grid-template-columns:1fr}
ol.list li.sep:hover{background:none;color:var(--ink-3)}
.phases{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phases span.pp{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--box);color:var(--ink-3)}
.phases span.ar{color:var(--ink-3);font-size:13px}
.phases span.pp.on.p1{background:var(--bad-bg);color:var(--bad)} .phases span.pp.on.p2{background:var(--q-bg);color:var(--q)} .phases span.pp.on.p3{background:var(--ok-bg);color:var(--ok)}
.phases span.pp.done{color:var(--ink-2);background:var(--panel);border:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px}
.cmp .h{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--ink-2)}
.cmp b{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.cmp b.bf{background:var(--bad-bg);color:var(--bad)} .cmp b.af{background:var(--ok-bg);color:var(--ok)}
.cmp span{color:var(--ink)} .cmp span.wait{color:var(--ink-3)}
.cmp2{display:grid;grid-template-columns:1fr;gap:8px}
@media (max-width:640px){.cmp2{grid-template-columns:1fr}}
.cmp2 .col{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .3s,background .3s}
.cmp2 .col b{font-size:12.5px;font-weight:600}
.cmp2 .col.bf b{color:var(--bad)} .cmp2 .col.af b{color:var(--ok)}
.cmp2 .col span{font-size:13px;line-height:1.55;color:var(--ink)}
.cmp2 .col.bf.on{border-color:var(--bad);background:var(--bad-bg)} .cmp2 .col.af.on{border-color:var(--ok);background:var(--ok-bg)}
.cmp2.ab .col b{color:var(--q)} .cmp2.ab .col.on{border-color:var(--q);background:var(--q-bg)}
.flowline{display:flex;flex-direction:column;gap:2px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.55}
.flowline b{font-weight:600;color:var(--ink)}
details.more summary{font-size:13px;color:var(--ink-2);cursor:pointer;padding:4px 2px}
.grid{grid-template-columns:clamp(300px,20vw,400px) minmax(0,1fr)}
.now .c{font-size:18px}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto;min-width:0}
svg{display:block;width:100%;min-width:900px;height:auto;max-height:calc(100vh - 150px);min-height:420px}
svg text{font-family:var(--f-body);dominant-baseline:central}
.node{transition:opacity .4s}
.node.hide{display:none}
.node.dim,.edge.dim,.sseln.dim{opacity:.16}
.node .frame{fill:var(--panel);stroke:var(--line-2);stroke-width:1.6;transition:fill .3s,stroke-width .3s}
.node.on .frame{stroke-width:3;fill:var(--accent-bg)}
.node.dash .frame{stroke-dasharray:7 5}
.node.pop .frame{animation:pop 1.2s ease}
@keyframes pop{0%{stroke-width:6}100%{stroke-width:1.6}}
.node.pulse .frame,.node.pulse .body{animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{0%,100%{stroke-width:2}50%{stroke-width:7}}
.t1{font-size:14px;font-weight:600;fill:var(--ink);text-anchor:middle}
.t2{font-size:12px;fill:var(--ink-2);text-anchor:middle}
.cyl .body{stroke-width:1.5;transition:stroke-width .3s}
.cyl.on .body{stroke-width:3}
.cyl.dash .body{stroke-dasharray:7 5}
.db-n .body{fill:var(--n-bg);stroke:var(--n)} .db-n .dbt{fill:var(--n)}
.db-p .body{fill:var(--p-bg);stroke:var(--p)} .db-p .dbt{fill:var(--p)}
.db-q .body{fill:var(--q-bg);stroke:var(--q)} .db-q .dbt{fill:var(--q)}
.db-a .body{fill:var(--accent-bg);stroke:var(--accent)} .db-a .dbt{fill:var(--accent)}
.dbt{font-size:12.5px;font-weight:600;text-anchor:middle}
.trow rect{fill:var(--panel);stroke:var(--line);transition:fill .3s,stroke .3s}
.trow .rl{font-size:12.5px;font-weight:500;fill:var(--ink)}
.trow.flash rect{fill:var(--warn-bg);stroke:var(--warn)}
.trow.pend rect{fill:var(--warn-bg);stroke:var(--warn);stroke-dasharray:4 3}
.trow.ok rect{fill:var(--ok-bg);stroke:var(--ok)}
.trow.bad rect{fill:var(--bad-bg);stroke:var(--bad)}
.cnt{font-size:12px;font-weight:600;fill:var(--ink);text-anchor:end;font-variant-numeric:tabular-nums}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-linejoin:round;transition:stroke .3s,stroke-width .3s}
.edge.on{stroke:var(--accent);stroke-width:3}
.edge.hide{display:none}
.tag{opacity:0;transition:opacity .3s;pointer-events:none}
.tag.show{opacity:1}
.tag rect{fill:var(--ink);opacity:.92} .tag text{fill:var(--panel);font-size:12px;font-weight:500;text-anchor:middle}
.pk{stroke:var(--panel);stroke-width:2.5}
.pk.go{fill:var(--accent)} .pk.back{fill:var(--ok)} .pk.ext{fill:var(--q)} .pk.bad{fill:var(--bad)}
.mini{fill:var(--box);stroke:var(--line-2);transition:fill .3s,stroke .3s}
.mini.ok{fill:var(--ok-bg);stroke:var(--ok)} .mini.wait{fill:var(--warn-bg);stroke:var(--warn)} .mini.bad{fill:var(--bad-bg);stroke:var(--bad)} .mini.run{fill:var(--accent-bg);stroke:var(--accent)}
.mtxt{font-size:11.5px;fill:var(--ink-2);text-anchor:middle}
.note{font-size:12px;font-weight:500;fill:var(--ink-2);text-anchor:middle}
.note.ok{fill:var(--ok)} .note.bad{fill:var(--bad)} .note.warn{fill:var(--warn)}
.sseln{fill:none;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.sseln.ok{stroke:var(--ok)} .sseln.flow{stroke-width:4.5} .sseln.bad{stroke:var(--bad);stroke-dasharray:10 8}
.ovl rect{fill:var(--down);fill-opacity:.82} .ovl text{fill:#f2f2f2;font-size:14px;font-weight:600;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);padding:4px 6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;border:1.5px solid}
.dot{width:10px;height:10px;border-radius:50%}
@media (max-width:640px){header{position:static}.brand{display:none}.scr button{padding:6px 10px;font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<header>
  <button class="ham" id="ham" aria-label="화면 메뉴 열기" aria-expanded="false" aria-controls="drawer"><i></i><i></i><i></i></button>
  <span class="brand">다먹자 알림 시뮬레이터</span>
  <nav class="scr" id="scr" aria-label="화면 선택"></nav>
</header>
<div class="shade" id="shade"></div>
<nav class="drawer" id="drawer" aria-label="화면 메뉴"><div class="hd">화면</div><div id="dlist" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="foot">교육·설계 검토용 가상 시뮬레이터야. 실제 서비스를 바꾸거나 알림을 보내지 않아. 숫자와 시간은 교육용 가정이야.</div></nav>
<iframe id="legacy" title="기존 알림 배치 시뮬레이터" hidden style="display:block;width:100%;height:calc(100vh - 60px);border:0"></iframe>
<div class="wrap" id="main">
  <p class="lede" id="slede" hidden></p>
  <div class="ctl">
    <h1 id="stitle"></h1>
        <select id="sel"></select>
    <button class="btn primary" id="play">재생</button>
    <button class="btn" id="prev">이전</button>
    <button class="btn" id="next">다음</button>
    <button class="btn" id="home">처음으로</button>
    <label for="speed">속도</label>
    <select id="speed"><option value="0.5">아주 느리게</option><option value="0.75">느리게</option><option value="1" selected>보통</option><option value="1.6">빠르게</option></select>
  </div>
  <div class="grid">
    <aside class="card">
      <div class="chips" id="chips" hidden></div>
      <div class="phases" id="phases"></div>
      <div class="now" aria-live="polite"><span class="k" id="nowk"></span><span class="c" id="nowc"></span></div>
      <div class="stepbox idle" id="whatbox"><span class="who">지금 하는 일</span><div id="nows"></div><div class="abrow" id="abrow" hidden></div></div>
      <div class="cmp2" id="cmp"><div class="col bf"><b id="cmpLa">문제</b><span id="cmpA"></span></div><div class="col af"><b id="cmpLb">해결책</b><span id="cmpB"></span></div></div>
      <div class="flowline" id="info"></div>
      <ol class="list" id="list"></ol>
    </aside>
    <div class="canvas">
      <svg id="svg" viewBox="0 0 1200 600" role="img" aria-label="알림 흐름 그림">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <g id="conns"></g><g id="edges"></g><g id="nodes"></g><g id="tags"></g><g id="pk"></g>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:var(--accent)"></i>요청·저장</span>
        <span><i class="dot" style="background:var(--ok)"></i>응답·조회 결과</span>
        <span><i class="dot" style="background:var(--q)"></i>신호·외부 호출</span>
        <span><i class="dot" style="background:var(--bad)"></i>실패</span>
        <span><i class="sw" style="border-color:var(--ink-3);border-style:dashed"></i>해결 후보로 추가되는 장치</span>
        <span><i class="sw" style="border-color:var(--ok);border-style:dotted"></i>SSE 연결 (V2 후보)</span>
      </div>
    </div>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,cls,extra){const t=el('text',Object.assign({x,y,class:cls},extra||{}),p);t.textContent=s;return t}
const SVG=$('svg'),NODES=$('nodes'),EDGES=$('edges'),PK=$('pk'),TAGS=$('tags'),CONNS=$('conns');
const show=(g,v)=>{g.style.display=v?'':'none'};
let N={},E={},R={};

/* ---------- building blocks ---------- */
function box(id,x,y,w,h,title,sub,o={}){const g=el('g',{class:'node'+(o.dash?' dash':'')},NODES);
  const fr=el('rect',{class:'frame',x,y,width:w,height:h,rx:12},g);if(o.stroke)fr.style.stroke=o.stroke;
  const t=txt(g,x+w/2,y+24,title,'t1');if(o.stroke)t.style.fill=o.stroke;

  const ov=el('g',{class:'ovl',style:'display:none'},g);el('rect',{x,y,width:w,height:h,rx:12},ov);const ovt=txt(ov,x+w/2,y+h/2,'종료','');

const STOP={};let tok={dead:true,fast:true},speed=1,paused=false,auto=false;
function vtime(ms,cb){const t=tok;if(t.dead)return Promise.reject(STOP);if(t.fast){cb&&cb(1);return Promise.resolve()}
  return new Promise((res,rej)=>{let e=0,last=performance.now();(function f(now){if(t.dead)return rej(STOP);const dt=Math.min(now-last,100);last=now;e+=dt*(paused?0:speed);const k=Math.min(e/ms,1);cb&&cb(k);if(k<1)requestAnimationFrame(f);else res()})(last)})}

let FLOWN=0,REC=null;

function fly(id,cls,o={}){if(tok.dead)return Promise.reject(STOP);const ed=E[id];if(!ed)throw new Error('edge '+id);
  let P=o.rev?[...ed.pts].reverse():ed.pts;let k=id,lab=o.label!=null?o.label:ed.label;
  if(cls==='ext'&&!o.rev&&/^S/.test(ed.a)&&/^B/.test(ed.b)){const ck=Object.keys(E).find(q=>E[q].isConn&&E[q].a===ed.b&&E[q].b===ed.a&&N[q.slice(1)].g.style.display!=='none');
    if(ck){k=ck;P=[...E[ck].pts].reverse();if(o.label==null)lab='SSE 안내'}}
  if(o.rev&&!ed.isConn)ed.p.setAttribute('marker-start','url(#ah)');
  if(tok.fast){if(REC)REC.push([k,lab]);return Promise.resolve()}FLOWN++;
  const ke=E[k];if(lab)tag(k,lab);else{ke.p.classList.add('on')}if(ke.isConn)ke.p.classList.add('flow');
  const c=el('circle',{r:9,class:'pk '+(cls||'go'),cx:P[0][0],cy:P[0][1]},PK);
  const seg=[];let tot=0;for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);seg.push(d);tot+=d}
  return vtime(o.ms||F,q=>{let d=q*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++}const r=seg[i]?Math.min(d/seg[i],1):1;
    c.setAttribute('cx',P[i][0]+(P[i+1][0]-P[i][0])*r);c.setAttribute('cy',P[i][1]+(P[i+1][1]-P[i][1])*r)}).finally(()=>{c.remove();if(!tok.dead)untag(k)})}

  st('fix','보내기 전 상태를 먼저 기록','대응은 보내기 전에 보내는 중과 시도 시각을 먼저 저장하는 거야. 결과 저장이 실패해도 결과를 모르는 작업이라는 사실이 DB에 남아.',['J'],[],async()=>{rlabel('j1','작업 #1 (상태를 먼저 기록)');await wait(900)}),
  st('re','같은 조건으로 다시 실행','같은 데이터와 같은 장애로 다시 해. 보내기 전에 #1을 보내는 중으로 저장하고 보내.',['S1','J','W'],['S1-J','S1-W'],async()=>{resetData();await fly('S1-J','go',{label:'보내는 중 기록'});setR('j1','보내는 중 · 08:00','pend');await fly('S1-W','ext',{label:'#1 발송'});await back('S1-W',{label:'수락'});note('W','수락함','ok')}),
  st('re','결과 저장 실패 뒤의 처리','결과 저장이 실패해도 #1은 결과를 모르는 상태로 남아. 바로 다시 보내지 않고, 정한 시간이 지나면 다시 보낼지 규칙에 따라 판단해.',['S1','J'],['S1-J'],async()=>{await fly('S1-J','bad',{label:'결과 저장 실패'});setR('j1','결과 모름 · 확인 필요','pend')}),
  st('sum','남는 한계','상태를 숨기지 않고 관리할 수는 있어. 하지만 외부 발송이 두 번 되지 않는다고 보장하지는 못해. 다른 서버가 작업을 선점하는 장치가 있어도 이 중복은 완전히 없어지지 않아.',[],[],async()=>{note('W','재발송하면 중복 가능','warn');await wait(600)})]},

 {name:'2. 냉장고별 순차 처리로 배치 시간 증가',scene:'batch',opt:{single:1,xname:'독립 발송 실행자'},show:['S1','RF','ND'],tags:['perf','sol'],cls:['now','perf'],
  intro:'냉장고가 늘면 생성 단계가 길어질 수 있다는 성능 가설이야. 실제 시간은 측정 전이라 효과를 확정하지 않아.',
  steps:[
  st('norm','냉장고 3곳이면 금방','냉장고마다 T1을 순서대로 처리해. 3곳은 금방 끝나.',['S1','RF','ND'],['S1-ND'],async()=>{for(let k=1;k<=3;k++){await fly('S1-ND','go',{ms:F*.5});setR('nd1',k+'건','ok')}}),
  st('prob','냉장고가 많아지면','교육용 가정으로 냉장고가 3,000곳이면, 한 흐름이 하나씩 처리해서 생성 단계가 길어져.',['S1','RF'],['S1-RF'],async()=>{setR('rf','3,000곳 (가정)','flash');await count('S1',0,3000,2400,v=>'냉장고 '+v+' / 3,000')}),
  st('obs','뒤 단계가 밀릴 수 있음','발송 작업 생성과 첫 발송은 생성이 모두 끝난 뒤에 시작해. 그래서 첫 푸시가 늦어질 수 있어. 얼마나 늦는지는 측정 전이야.',['S1'],[],async()=>{note('S1','첫 발송은 생성이 끝난 뒤','warn');await wait(900)}),
  st('fix','제한된 단위와 진행 기록','대응 후보는 냉장고를 정한 단위로 나눠 처리하고 어디까지 했는지 기록하는 거야. 발송은 독립 실행자가 따로 맡을 수 있어. 병렬로 나눌지는 측정 뒤에 정해.',['X','W'],[],async()=>{reveal('X','W','J');setR('rf','3,000곳 · 500곳씩 (가정)','ok');await wait(900)}),
  st('re','같은 물량으로 다시 실행','같은 3,000곳을 500곳씩 처리하고 단위마다 진행 위치를 기록해. 끝난 단위의 작업은 실행자가 먼저 보내기 시작할 수 있어.',['S1','ND','X','J','W'],['S1-ND','X-J','X-W'],
   async()=>{resetData();setR('rf','3,000곳 · 500곳씩 (가정)','ok');for(let k=1;k<=2;k++){await fly('S1-ND','go',{ms:F*.6});note('S1','진행 기록: '+k*500+'곳','ok');setR('j1','단위 '+k+' 작업 생성','pend')}await fly('X-J','go',{label:'끝난 단위 작업'});await fly('X-W','ext');note('X','첫 발송 시작','ok')}),
  st('sum','검증할 지표','해결 효과는 확정하지 않아. 냉장고당 처리 시간, 전체 생성 시간, 첫 발송까지 걸린 시간, 쿼리 시간으로 확인해. 3번과 5번 문제와 원인이 이어질 수 있어.',[],[],async()=>{await wait(600)})]},

 {name:'3. 푸시 작업 대량 생성·저장',scene:'batch',opt:{single:1,xname:'독립 발송 실행자'},show:['S1','ND','J'],tags:['code','perf','sol'],cls:['now','perf'],
  intro:'T2는 오늘 알림 전체의 작업을 한 번에 조회해서 한 트랜잭션으로 저장해. 물량이 커질 때의 성능 가설이야.',
  steps:[
  st('norm','작업 3건을 한 번에 저장','오늘 알림과 푸시를 켠 기기를 묶어 작업을 만들고 한 트랜잭션으로 저장해.',['S1','J'],['S1-J'],async()=>{await fly('S1-J','go',{label:'작업 3건 저장'});['j1','j2','j3'].forEach(k=>setR(k,'대기','pend'))}),
  st('prob','물량이 많아지면','가정으로 작업이 30,000건이면 한 번의 조회 결과와 한 트랜잭션에 모두 담겨. 저장이 길어질 수 있다는 가설이야.',['S1','J'],['S1-J'],async()=>{rlabel('j1','오늘 작업');setR('j1','30,000건 저장 중 (가정)','pend');await count('S1',0,30000,2400,v=>'저장 '+v.toLocaleString()+'건')}),
  st('obs','끝나야 첫 발송 시작','이 트랜잭션이 끝나야 첫 발송이 시작돼. 중간에 실패하면 전부 롤백되고 같은 실행에서 다시 만들지 않아. 저장 크기와 DB 영향은 측정 대상이야.',['S1','J'],[],async()=>{setR('j1','실패하면 전부 롤백','bad');note('S1','첫 발송 대기','warn');await wait(900)}),
  st('fix','나눠 만들고 빠진 건 복구','대응 후보는 정한 단위로 나눠 생성하고, 빠진 작업은 복구 경로로 채우고, 발송은 독립 실행자가 맡는 거야.',['X','W'],[],async()=>{reveal('X','W');await wait(900)}),
  st('re','같은 물량으로 다시 실행','같은 30,000건을 1,000건씩 나눠 저장해. 먼저 저장된 단위부터 실행자가 보내기 시작해.',['S1','J','X','W'],['S1-J','X-J','X-W'],
   async()=>{resetData();rlabel('j1','오늘 작업');for(let k=1;k<=3;k++){await fly('S1-J','go',{ms:F*.5,label:'1,000건 저장'});setR('j1',(k*1000).toLocaleString()+'건 저장됨','pend')}await back('X-J',{label:'저장된 작업'});await fly('X-W','ext');note('X','먼저 저장된 단위 발송','ok')}),
  st('sum','검증할 지표','트랜잭션 시간, 잠금과 로그 크기, 첫 발송까지 시간을 측정해서 단위를 정해. 2번 문제와 이어질 수 있지만 따로 떨어진 병목이라고 단정하지 않아.',[],[],async()=>{await wait(600)})]},

 {name:'4. 가상 스레드 발송의 동시 처리·자원 한계',scene:'batch',opt:{single:1},show:['S1','J','W'],tags:['code','perf','sol'],cls:['now','perf'],
  intro:'발송 단계는 보낼 작업을 모두 가져와 작업마다 가상 스레드를 만들고, 동시 발송은 20개로 제한해. 작업이 많을 때의 자원 가설을 봐.',
  steps:[
  st('norm','작업마다 가상 스레드','보낼 작업 3건을 가져와 작업마다 가상 스레드를 만들어. 동시에 보내는 수는 20개까지야.',['S1','J','W'],['S1-J','S1-W'],async()=>{await back('S1-J',{label:'보낼 작업 3건'});note('S1','가상 스레드 3 · 동시 발송 3');await fly('S1-W','ext')}),
  st('prob','작업이 30,000건이면','가정으로 30,000건이면 한 번에 모두 가져오고 가상 스레드도 30,000개 만들어. 그중 20개만 보내고 나머지는 차례를 기다려.',['S1','J'],['S1-J'],async()=>{rlabel('j1','보낼 작업');setR('j1','30,000건 조회 (가정)','pend');await back('S1-J',{label:'전부 조회'});await count('S1',0,29980,2000,v=>'대기 '+v.toLocaleString()+' · 발송 20')}),
  st('obs','무엇이 쌓이는가','기다리는 가상 스레드와 작업 객체가 메모리에 함께 올라와. 가상 스레드가 기다린다고 DB 연결을 잡는 건 아니야. 작업이 많다고 같은 수의 DB 연결을 쓰는 것도 아니야. 메모리와 GC 영향은 측정 전 가설이야.',['S1'],[],async()=>{note('S1','메모리 영향은 측정 필요','warn');await wait(900)}),
  st('fix','꺼내는 양과 동시 발송 제한','대응은 한 번에 조회하고 선점하는 작업 수를 제한하고, 동시 발송 수 제한은 유지하는 거야. 숫자는 후속 실험으로 정해.',['S1'],[],async()=>{subt('S1','한 번에 500건 (가정) · 동시 20');await wait(900)}),
  st('re','같은 물량으로 다시 실행','같은 30,000건을 500건씩 가져와 20개씩 보내. 다 보내면 다음 500건을 가져와.',['S1','J','W'],['S1-J','S1-W'],
   async()=>{resetData();subt('S1','한 번에 500건 (가정) · 동시 20');rlabel('j1','보낼 작업');setR('j1','30,000건 (가정)','pend');for(let k=1;k<=3;k++){await back('S1-J',{label:'500건 조회',ms:F*.6});note('S1','대기 480 · 발송 20');await fly('S1-W','ext',{ms:F*.6})}}),
  st('sum','검증할 지표','힙 사용량, GC 시간, 발송 처리량, 외부 응답 시간으로 확인해. 동시 발송 20은 서버마다, 이 발송 호출마다 따로 적용되는 값이야.',[],[],async()=>{await wait(600)})]},

 {name:'5. 단일 배치의 지연·실패 전파와 중단 복구',scene:'batch',opt:{single:1},show:['S1','J','W'],tags:['code','risk','sol'],cls:['now'],
  intro:'지금 재시도는 08시 실행 하나가 기다리면서 해. 그 실행이 멈추면 무슨 일이 생기는지 보고 대응을 붙여.',
  steps:[
  st('norm','#1 성공 · #2 실패','#1은 수락됐고 #2는 외부 서비스 오류로 실패했어.',['S1','J','W'],['S1-W','S1-J'],async()=>{await fly('S1-W','ext',{label:'#1 · #2 발송'});await back('S1-W',{cls:'bad',label:'#1 수락 · #2 실패'});setR('j1','수락','ok');setR('j2','실패 1회','bad')}),
  st('norm','현재 재시도 정책','실패한 작업은 5분, 15분, 30분 뒤 최대 세 번 다시 보내고 정오를 넘기지 않아. 이 재시도는 같은 08시 실행이 기다리면서 해.',['S1','J'],['S1-J'],async()=>{await fly('S1-J','go',{label:'다음 시도 08:05'});setR('j2','재시도 대기 · 08:05','pend');note('S1','08:05까지 대기','warn')}),
  st('prob','기다리는 중 서버 종료','배포나 장애로 서버가 08:03에 꺼졌어. 기다리던 08시 실행도 같이 사라져.',['S1'],[],async()=>{down('S1',1,'08:03 종료');await wait(900)}),
  st('obs','이어갈 주체가 없음','서버가 다시 켜져도 08시 실행은 다음 날에야 돌아. #2는 재시도 대기로 남지만 정오까지 아무도 보내지 않아. 기다리는 동안 스케줄러 스레드를 잡고 있어서 다른 예약 작업도 밀릴 수 있어.',['S1','J'],[],async()=>{down('S1',0);note('S1','08:04 재시작 · 08시 실행 없음','bad');setR('j2','재시도 대기 · 아무도 안 보냄','bad');await wait(900)}),
  st('fix','미완료 기록과 독립 실행자','대응은 미완료 작업을 DB에 남기고, 08시 실행과 따로 도는 실행자가 주기적으로 보낼 차례인 작업을 찾아 처리하는 거야. 재시도 간격과 정오 기한 같은 현재 정책은 그대로 둘 수 있어.',['X'],[],async()=>{reveal('X');await wait(900)}),
  st('re','같은 장애로 다시 실행','같은 데이터로 다시 해. #1 수락, #2 실패, 08:03에 서버 종료, 08:04에 재시작까지 똑같아.',['S1','J','W'],['S1-W'],async()=>{resetData();await fly('S1-W','ext',{ms:F*.6});setR('j1','수락','ok');setR('j2','재시도 대기 · 08:05','pend');down('S1',1,'08:03 종료');await wait(700);down('S1',0);note('S1','08:04 재시작')}),
  st('re','08:05에 실행자가 이어서 발송','실행자가 DB에서 08:05가 된 #2를 찾아 보내고 결과를 저장해.',['X','J','W'],['X-J','X-W'],async()=>{await back('X-J',{label:'08:05 작업 #2'});await fly('X-W','ext');await fly('X-J','go',{label:'결과 저장'});setR('j2','수락','ok');note('X','#2 이어서 처리','ok')}),
  st('sum','해결 전후','해결 전에는 재시도가 실행과 함께 사라졌어. 해결 뒤에는 DB 기록에서 이어서 해. 실행자를 얼마나 자주 돌릴지는 미정이야.',[],[],async()=>{await wait(600)})]},

 {name:'6. 폴링의 변화 없는 반복 조회와 갱신 지연',scene:'poll',opt:{single:1},show:['B1','B2','S1','ND'],tags:['code','perf','sol'],cls:['now','perf','front'],
  intro:'지금 폴링은 서버 1대에서도 잘 동작해. 다만 변화가 없어도 계속 묻고, 새 알림은 늦게 보일 수 있어.',
  steps:[
  st('norm','30초마다 확인','두 화면이 30초마다 최신 알림 ID를 물어보고 같은 값을 받아.',['B1','B2','S1','ND'],['B1-S1','B2-S1','S1-B1','S1-B2'],async()=>{await both(fly('B1-S1'),fly('B2-S1'));await both(fly('S1-B1','back'),fly('S1-B2','back'))}),
  st('prob','변화가 없어도 계속 요청','새 알림이 하루 몇 건뿐이어도 화면마다 30초에 한 번씩 요청해. 보이는 화면이 1,000개면(가정) 1초에 약 33번이야.',['B1','B2','S1'],['B1-S1','B2-S1'],async()=>{await both(fly('B1-S1',null,{ms:F*.6}),fly('B2-S1',null,{ms:F*.6}));await count('S1',0,33,1600,v=>'초당 요청 '+v+'번 (가정)')}),

 {name:'저장과 아웃박스',scene:'v2',opt:{},show:['S1','F','ND','O','B2','B3','S2'],tags:['sol'],cls:['now'],
  intro:'아웃박스는 전달할 일을 적어 두는 테이블이야. 변경과 같은 트랜잭션에 저장해서, 커밋 뒤 발행 전에 서버가 꺼져도 다시 처리할 수 있게 해.',
  steps:[

  st('flow','한 트랜잭션에 넷을 기록','참여 변경, 알림, 수신자, 전달할 일 #7을 같은 DB 트랜잭션에 기록해. 알림은 있는데 전달할 일이 없는 상태는 생기지 않아.',['S1','F','ND','O'],['S1-F','S1-ND','S1-O'],async()=>{await both(fly('S1-F'),fly('S1-ND'),fly('S1-O'));setR('mem','U1 · U2 · U3','ok');setR('nd1','13건','ok');setR('nd2','U1 미읽음 2 · U2 미읽음 2','ok');setR('ob','#7 대기','pend')}),

  st('flow','S2가 연결된 화면에 안내','S2가 신호를 받아 자기에게 연결된 U1 노트북과 U2 아이패드에 안내하고, 화면이 최신 상태를 읽어.',['R','S2','B2','B3'],['R-S2','S2-B2','S2-B3'],async()=>{await fly('R-S2','ext');await both(fly('S2-B2','ext'),fly('S2-B3','ext'));badge('B2',2);badge('B3',2)}),

  st('sum','푸시 작업과 아웃박스','기존 푸시 작업은 발송과 재시도 기록이야. 아웃박스는 생성과 전달 사이 공백을 막는 기록이야. 역할이 달라서 무조건 합치지 않아. 08시 배치의 T1·T2를 유지한다면 빠진 작업을 찾아 만드는 경로가 따로 필요해.',[],[],async()=>{await wait(600)})]},

 {name:'후속 작업 처리 (선택 A·B)',scene:'v2',opt:{},show:['S1','ND','O','X','J','W'],tags:['sol'],cls:['now'],

 {name:'인앱 전달과 읽음 동기화',scene:'v2',opt:{},show:['B1','B2','B3','S1','S2','R','ND'],tags:['sol'],cls:['now'],

    ['첫 푸시가 늦어질 수 있음','푸시 작업 만들기와 첫 푸시는 알림을 다 만든 뒤에 시작해. 그래서 첫 푸시가 늦어질 수 있어. 얼마나 늦는지는 아직 재 보지 않았어.'],
    ['묶음으로 나누고 진행 위치 적기','냉장고를 정한 개수씩 묶어서 처리하고 어디까지 했는지 적어 두는 거야. 푸시 보내기는 따로 도는 실행자가 맡을 수 있어. 여러 개를 동시에 돌릴지는 재 본 뒤에 정해.'],
    ['같은 물량으로 다시 실행','같은 3,000곳을 500곳씩 처리하고 묶음마다 진행 위치를 적어. 끝난 묶음의 작업은 실행자가 먼저 보내기 시작할 수 있어.'],
    ['무엇으로 확인할까','효과는 아직 단정하지 않아. 냉장고 하나 처리 시간, 전체 시간, 첫 푸시까지 걸린 시간, DB 조회 시간으로 확인해. 3번, 5번 문제와 원인이 이어져 있을 수 있어.']]},
  {name:'3. 푸시 작업을 한꺼번에 너무 많이 만듦',intro:'08시 배치는 오늘 보낼 푸시 작업을 한 번에 다 만들어 한 번에 저장해. 물량이 커질 때 생길 수 있는 일을 가정해서 봐.',
   cmp:['작업을 전부 저장해야 첫 푸시가 나가고, 실패하면 전부 취소돼.','나눠서 저장한 묶음부터 보내. 실제 효과는 재 봐야 해.'],
   steps:[['작업 3건을 한 번에 저장','오늘 알림과 푸시를 켠 기기를 짝지어 작업을 만들고 한 번에 저장해.'],
    ['작업이 30,000건이면','교육용 숫자로 작업이 30,000건이면 그걸 전부 한 번에 저장해. 저장이 오래 걸릴 수 있다는 가정이야.'],
    ['다 저장해야 첫 푸시 시작','이 저장이 끝나야 첫 푸시가 나가. 중간에 실패하면 전부 취소되고, 같은 실행에서 다시 만들지 않아. DB에 주는 영향은 재 봐야 해.'],
    ['나눠 만들고 빠진 건 채우기','정한 개수씩 나눠 저장하고, 빠진 작업은 복구 실행자가 채우고, 보내기는 따로 도는 실행자가 맡는 거야.'],
    ['같은 물량으로 다시 실행','같은 30,000건을 1,000건씩 나눠 저장해. 먼저 저장된 묶음부터 실행자가 보내기 시작해.'],
    ['무엇으로 확인할까','저장에 걸린 시간, DB가 잡고 있는 시간, 첫 푸시까지 걸린 시간을 재서 묶음 크기를 정해. 2번 문제와 이어질 수 있지만 따로 떨어진 문제라고 단정하지 않아.']]},
  {name:'4. 푸시를 한꺼번에 많이 보내면 서버나 외부 발송 서비스가 감당하기 어려워짐',intro:'푸시를 보낼 때 작업마다 가벼운 실행 단위(가상 스레드)를 하나씩 만들고, 동시에 보내는 건 20개로 막아. 작업이 많을 때를 가정해서 봐.',
   cmp:['작업 30,000건을 한꺼번에 올려 두고 보내서, 서버 메모리와 외부 발송 서비스 모두 부담이 커질 수 있어.','가져오는 양과 동시에 보내는 양을 둘 다 제한해. 실제 영향은 재 봐야 해.'],
   steps:[['작업마다 실행 단위 하나','보낼 작업 3건을 가져와서 작업마다 실행 단위를 하나씩 만들어. 동시에 보내는 건 20개까지야.'],
    ['작업이 30,000건이면','교육용 숫자로 30,000건이면 전부 한 번에 가져오고 실행 단위도 30,000개 만들어. 그중 20개만 보내고 나머지는 차례를 기다려.'],
    ['어디에 부담이 가나','기다리는 실행 단위와 작업 정보가 서버 메모리에 같이 올라와. 외부 발송 서비스에도 요청이 몰리고, 실패와 재시도가 늘 수 있어. 기다린다고 DB 연결을 잡고 있는 건 아니야. 얼마나 부담인지는 재 보기 전 가정이야.'],
    ['가져오는 양 줄이기','한 번에 가져오는 작업 수를 정해 두고, 동시에 보내는 20개 제한은 그대로 두는 거야. 숫자는 실험해서 정해.'],
    ['같은 물량으로 다시 실행','같은 30,000건을 500건씩 가져와서 20개씩 보내. 다 보내면 다음 500건을 가져와.'],
    ['무엇으로 확인할까','메모리 사용량, 메모리 정리(GC) 시간, 보내는 속도, 외부 응답 시간과 오류 비율로 확인해. 20개 제한은 서버마다 따로 걸리는 숫자야.']]},
  {name:'5. 재시도를 기다리다 서버가 꺼지면 푸시가 안 나감',intro:'지금 재시도는 08시 실행이 계속 기다리면서 해. 그 실행이 멈추면 어떻게 되는지 보고 해결 장치를 붙여 봐.',
   cmp:['재시도를 기다리던 실행이 같이 사라져서 정오까지 아무도 안 보내.','DB에 남은 재시도를 따로 도는 실행자가 이어서 보내.'],
   steps:[['#1 성공, #2 실패','#1은 잘 나갔고 #2는 외부 서비스 오류로 실패했어.'],
    ['지금 재시도 방식','실패하면 5분, 15분, 30분 뒤에 최대 세 번 다시 보내고 정오를 넘기지 않아. 이 재시도는 같은 08시 실행이 기다리면서 해.'],
    ['기다리는 중 서버 꺼짐','배포나 장애로 서버가 08:03에 꺼졌어. 기다리던 08시 실행도 같이 사라져.'],
    ['이어서 보낼 주체가 없음','서버가 다시 켜져도 08시 실행은 다음 날에야 돌아. #2는 DB에 재시도 대기로 남지만 정오까지 아무도 안 보내. 기다리는 동안 예약 작업 실행 칸을 잡고 있어서 다른 예약 작업도 밀릴 수 있어.'],
    ['따로 도는 실행자','남은 작업을 DB에 두고, 08시 실행과 따로 도는 실행자가 주기적으로 보낼 차례인 작업을 찾아 보내는 거야. 재시도 간격과 정오 기한은 그대로 둘 수 있어.'],
    ['같은 상황으로 다시 실행','처음 상태로 돌려서 다시 해. #1 성공, #2 실패, 08:03 서버 꺼짐, 08:04 다시 켜짐까지 똑같아.'],
    ['08:05에 실행자가 이어서 보냄','실행자가 DB에서 08:05가 된 #2를 찾아 보내고 결과를 저장해.'],
    ['해결 전후','해결 전에는 재시도가 실행과 함께 사라졌어. 해결 뒤에는 DB 기록을 보고 이어서 해. 실행자를 얼마나 자주 돌릴지는 아직 정하지 않았어.']]},
  {name:'6. 새 알림이 없어도 30초마다 계속 물어봄',intro:'지금 폴링은 서버 1대에서 잘 돌아가. 다만 새 알림이 없어도 계속 묻고, 새 알림은 늦게 보일 수 있어.',
   cmp:['새 알림이 없어도 계속 묻고, 새 알림은 최대 30초 늦게 보여.','새 알림이 생길 때만 서버가 알려 줘서 바로 보여. 대신 연결을 유지해야 해.'],
   steps:[['30초마다 확인','두 화면이 30초마다 최신 알림 번호를 물어보고 같은 값을 받아.'],
    ['새 알림이 없어도 계속 물어봄','새 알림이 하루 몇 건뿐이어도 화면마다 30초에 한 번씩 물어. 열린 화면이 1,000개면(교육용 숫자) 1초에 약 33번이야.'],
    ['새 알림이 늦게 보임','새 알림이 저장돼도 다음 질문 때까지 최대 30초 늦게 보여.'],
    ['서버가 먼저 알려 주기 (SSE 후보)','화면과 서버가 연결을 열어 두고, 새 알림이 생기면 서버가 "다시 확인해"라고 알려 주는 거야. 화면은 그때만 최신 상태를 읽어. 서버가 화면으로 계속 알려 줄 수 있게 열어 두는 이 연결을 SSE라고 해.'],
    ['같은 새 알림으로 다시 실행','같은 새 알림 #13이 저장돼. 서버가 두 화면에 바로 알리고, 화면이 최신 상태를 읽어.'],
    ['새로 생기는 할 일','연결을 계속 열어 둬야 해. 연결이 끊긴 동안 놓친 알림은 다시 연결할 때 최신 상태를 읽어서 채워야 해.'],
    ['무엇으로 확인할까','요청 수와 늦게 보이는 시간이 실제로 줄어드는지 재 봐야 해. 연결을 열어 두는 비용도 같이 봐. 폴링이 오류로 멈췄을 때 다시 시작하는 건 프론트 쪽 일이야.']]},
  {name:'7. 구독이 바뀌었는데 이전 구독 정보로 발송을 시도함',intro:'서버 1대 안에서도 푸시 보내기와 구독 바꾸기가 동시에 일어날 수 있어. 보내는 쪽은 버전을 확인한 뒤 주소를 한 번 더 따로 읽어.',
   cmp:['이전 구독(v1) 기준으로 만든 작업을, 확인 뒤 바뀐 구독(v2)으로 그대로 보내. 같은 기기 안의 일이지만 확인한 것과 보낸 대상이 달라.','보낼 구독을 읽을 때 버전도 같이 봐서, 이전 구독 기준 작업은 보내지 않고 취소해.'],
   steps:[['버전이 같으면 보냄','작업 #1은 구독 v1일 때 만든 거고, 지금 구독도 v1이야. 같으니까 보내.'],
    ['확인 직후 구독이 바뀜','그 순간 아이패드가 구독을 새로 받아서 바꿔 달라고 했어. 구독이 주소 B, v2로 바뀌어.'],
    ['v1로 확인하고 v2로 보냄','보내는 쪽은 주소를 얻으려고 구독을 한 번 더 읽어. 이때 읽은 건 바뀐 v2의 주소 B야. 확인한 구독과 실제로 보낸 구독이 달라.'],
    ['보낼 구독에서 같이 확인','실제로 보낼 구독을 읽을 때 버전과 상태도 같이 확인하는 거야. 확인과 주소 읽기를 따로 하지 않아.'],
    ['같은 상황으로 다시 실행','처음 상태로 돌려서 같은 순서로 다시 해. 보내기 전에 구독이 v2로 바뀌어.'],
    ['v1 작업은 안 보냄','보내는 쪽이 구독을 한 번 읽어서 주소와 버전을 같이 봐. 작업은 v1 기준인데 지금은 v2라서 작업을 취소해.'],
    ['정리','서버 1대에서도 생기는 문제야. 서버 수와 상관없이 같은 확인이 필요해. 따로 고칠 버그로 다뤄.']]},
  {name:'8. 늦게 온 "구독 없음" 응답이 새 구독을 꺼 버림',intro:'외부 서비스가 404·410으로 답하면 "그 주소의 구독은 없어졌다"는 뜻이야. 이 답이 늦게 오면 이미 바뀐 새 구독까지 꺼 버릴 수 있어.',
   cmp:['옛 주소에 대한 늦은 응답 때문에 새 구독 v2가 꺼져.','보낼 때 버전과 지금 버전이 같을 때만 꺼서 v2는 그대로 살아 있어.'],
   steps:[['주소 A로 보냄','작업 #1을 v1의 주소 A로 보냈어. 답을 기다리는 중이야.'],
    ['기다리는 사이 구독 바뀜','그 사이 아이패드가 구독을 새로 받아서 주소 B, v2로 바뀌었어.'],
    ['주소 A는 없다는 답','외부 서비스가 주소 A는 없다고(410) 답했어. 주소 A는 이미 버려졌으니 맞는 답이야.'],
    ['새 구독이 꺼짐','보내는 쪽은 이 기기의 구독을 꺼 버려. 지금은 켜져 있는지만 보고 버전은 비교하지 않아. 그래서 방금 받은 v2가 꺼져.'],
    ['버전이 같을 때만 끄기','"구독 없음" 결과를 저장할 때, 보낼 때의 버전이 지금 버전과 같을 때만 끄도록 조건을 거는 거야. 다르면 아무것도 바꾸지 않아.'],
    ['같은 순서로 다시 실행','주소 A로 보내기, 구독 바뀜, 늦은 410까지 같은 순서로 다시 해.'],
    ['v2는 그대로','조건이 안 맞아서 끄지 않아. 새 구독 v2는 켜진 채로 남아.'],
    ['정리','모든 오류에서 구독을 끄는 건 아니야. 404·410일 때만 끄고, 그때도 보낸 버전이 같을 때만 반영해.']]},
  {name:'9. 구독이 동시에 두 번 바뀌면 버전이 한 번만 오름',intro:'구독 버전은 읽은 값에 1을 더해서 저장해. 두 요청이 동시에 오면 하나가 덮어써져서 사라질 수 있어.',
   cmp:['두 번 바뀌었는데 버전은 v2라서 변경 하나가 사라져.','DB에서 "지금 값 + 1"로 올려서 v3이 돼.'],
   steps:[['요청 하나면 정상','구독 바꾸기 요청 하나는 v1을 읽고 v2로 저장해.'],
    ['두 요청이 동시에 v1을 읽음','처음 상태로 돌려서, 구독 끄기와 바꾸기 요청이 거의 동시에 왔어. 둘 다 v1을 읽어.'],
    ['각자 v2로 저장','각자 읽은 v1에 1을 더해 v2로 저장해. 나중에 저장한 값이 앞의 값을 덮어써.'],
    ['두 번 바뀌었는데 v2','변경은 두 번 있었는데 버전은 한 번만 올랐어. 버전으로 옛 작업과 새 구독을 구분하기 어려워져.'],
    ['동시에 와도 안 덮어쓰게','DB에서 "지금 값에 1 더하기"를 한 번에 하거나, 늦게 저장한 쪽을 실패시키는 방법이 있어. 어느 쪽으로 할지는 아직 정하지 않았어. 여기서는 첫 번째 방법을 보여 줘.'],
    ['같은 동시 요청으로 다시 실행','같은 두 요청이 동시에 와. 이번에는 DB에서 지금 값에 1을 더해서 v2, v3 순서로 올라가.'],
    ['정리','마지막 구독 상태를 어느 요청 기준으로 남길지도 따로 정해야 해. 따로 고칠 버그로 다루고, 방법은 아직 정하지 않았어.']]}
 ],
 3:[
  {name:'서버 두 대가 같은 알림을 두 번 만듦',intro:'서버가 늘었다고 모든 일이 두 번 일어나지는 않아. 서버마다 스스로 시작하는 예약 작업이 겹칠 때 생기는 일을 봐.',
   cmp:['같은 알림이 2건 생겨서 알림함에 두 번 보여.','실행권으로 한 서버만 돌고, 겹쳐도 같은 키는 DB가 막아서 1건이야.'],
   steps:[['서버 1대일 때','S1이 냉장고 1의 임박 알림 1건과 받는 사람 기록 2건을 만들어.'],
    ['S2도 같은 08시 일정','처음 상태로 돌리고 서버를 2대로 늘렸어. 두 서버가 같은 코드와 같은 08시 일정을 가져서 각자 배치를 시작해.'],
    ['둘 다 같은 알림 저장','두 서버가 같은 냉장고 1을 보고 각자 임박 알림을 저장해. 서로 상대가 만든 걸 몰라.'],
    ['같은 알림이 두 개','U1·U2 알림함에 같은 알림이 두 번 보여. 이 알림으로 푸시 작업도 두 벌 생겨.'],
    ['실행권과 중복 막는 키','두 가지를 붙여. 하나는 "08시 배치는 내가 한다"는 실행권을 한 서버만 갖게 하는 거야. 다른 하나는 냉장고·날짜·알림 종류가 같으면 DB가 두 번째 저장을 막게 하는 거야. 실행권은 두 번 시작하지 않게 하고, 키는 그래도 겹쳤을 때 두 번 저장되지 않게 해. 여러 번 해도 한 번 한 것과 결과가 같은 성질을 멱등성이라고 해.'],
    ['같은 상황으로 다시 실행','다시 두 서버가 08시에 함께 시작해. 둘 다 실행권을 달라고 하고 S1만 얻어. S2는 이번엔 건너뛰어.'],
    ['S1만 알림 저장','S1이 알림 1건과 받는 사람 기록 2건을 저장해.'],
    ['실행권 기한이 지나 겹친 경우','S1이 느려서 실행권 기한이 지났고, S2가 실행권을 얻어 다시 시작했어. S2가 같은 알림을 저장하려 하지만 키가 같아서 DB가 막아.'],
    ['정리','해결 전에는 같은 알림이 2건이었어. 해결 뒤에는 1건이야. 실행권 기한을 몇 분으로 할지는 아직 정하지 않았어.']]},
  {name:'서버 두 대가 같은 푸시를 두 번 보냄',intro:'푸시를 보낼 때 보낼 작업을 읽기만 하고 "내가 맡았다"는 표시는 안 해. 두 서버가 같은 작업을 읽으면 어떻게 되는지 봐.',
   cmp:['두 서버가 같은 작업을 읽어서 같은 푸시가 두 번 나가.','맡은 서버를 표시해서 한 번씩만 나가고, 꺼진 서버의 작업은 다른 서버가 이어받아.'],
   steps:[['서버 1대일 때','S1이 #1, #2를 한 번씩 보내.'],
    ['두 서버가 같은 작업을 읽음','처음 상태로 돌리고 S2를 더했어. 두 서버가 같은 시각에 보낼 작업을 찾아서 #1, #2를 같이 읽어.'],
    ['같은 푸시가 두 번','두 서버가 둘 다 보내서 같은 푸시가 두 번 나가. 08시 실행을 하나로 줄여도, 따로 도는 실행자를 여러 서버에서 돌리면 다시 생기는 문제야.'],
    ['"내가 맡았다" 표시하기','작업을 고를 때 "S1이 08:05까지 맡음"처럼 한 번에 표시해. 결과를 저장할 때 아직 내가 맡은 게 맞는지 확인해. 기한이 지나도 결과가 없으면 다른 서버가 가져가. 이렇게 맡았다고 먼저 표시하는 걸 선점이라고 해.'],
    ['같은 상황으로 다시 실행','같은 시각에 두 서버가 작업을 찾아. S1이 #1, #2를 먼저 맡아서 S2는 고를 작업이 없어.'],
    ['#1을 보내고 S1 꺼짐','S1이 #1을 보내고 결과를 저장했어. #2를 보내기 전에 S1이 꺼졌어.'],
    ['기한 지난 #2를 S2가 가져감','#2를 맡은 기한이 지나면 S2가 다시 맡아서 보내. 결과는 한 번씩만 저장돼.'],
    ['남는 한계','②의 1-B처럼 푸시는 나갔는데 결과 저장 전에 서버가 꺼지면, 이어받은 서버가 다시 보낼 수 있어. 맡음 표시는 동시에 두 번 보내는 건 막지만 이 경우까지 없애지는 못해.']]},
  {name:'서버가 늘면 한꺼번에 나가는 푸시도 늘어남',intro:'동시에 보내는 푸시 20개 제한은 서버마다 따로 걸려. 서버가 늘면 전체 양이 어떻게 되는지 봐.',
   cmp:['서버 2대면 동시에 최대 40개가 나가.','전체 한도를 정해 서버들이 나눠 써. 숫자는 아직 정하지 않았어.'],
   steps:[['서버 1대면 최대 20','S1 하나만 보내면 외부로 동시에 나가는 푸시는 최대 20개야.'],
    ['서버 2대면 최대 40','S2를 더했어. 서버마다 20개씩이라 합치면 최대 40개야. 서버가 N대면 20×N이 돼.'],
    ['어디에 영향을 주나','외부 서비스가 정한 한도에 걸리거나 우리 서버 자원을 더 쓸 수 있어. 실제 한도와 영향은 아직 확인 전이야.'],
    ['전체 한도 정하기','서버 수와 상관없이 전체로 동시에 몇 개까지 보낼지 정하는 장치가 필요해. 방법과 숫자는 아직 정하지 않았어.'],
    ['같은 2대로 다시 실행','전체 한도를 30으로 가정하면 두 서버가 나눠 써서 합이 30을 넘지 않아.'],
    ['무엇으로 확인할까','외부 응답 코드, 보내는 속도, 늦어지는 시간을 보고 한도를 정해. 효과는 재 보기 전이라 단정하지 않아.']]},
  {name:'서버 두 대가 같은 정리를 두 번 함',intro:'03시 정리도 서버마다 스스로 시작해. 두 서버가 같이 정리하면 무엇이 생기고 무엇은 안 생기는지 봐.',
   cmp:['결과는 99건으로 같지만 같은 삭제를 두 번 하고 서로 기다릴 수 있어.','한 서버만 정리해서 삭제를 한 번만 해.'],
   steps:[['서버 1대일 때','S1이 120건을 99건으로 줄이고, 아무도 안 쓰는 알림 내용을 지워.'],
    ['두 서버가 같이 정리','처음 상태로 돌리고 S2를 더했어. 두 서버가 03시에 같은 기준으로 정리를 시작해.'],
    ['결과는 같고 일은 두 배','기준이 같아서 결과는 99건으로 같아. 더 많이 지워지지는 않아. 대신 같은 삭제를 두 번 해서 DB 일이 늘고, 같은 줄을 지우려 하면 한쪽이 기다릴 수 있어. 항상 기다리는 건 아니야.'],
    ['실행권으로 한 서버만','08시 배치와 같은 실행권으로 03시 정리도 한 서버만 하게 해.'],
    ['같은 상황으로 다시 실행','두 서버가 실행권을 달라고 하고 S1만 얻어. S1만 정리해.'],
    ['정리','해결 전후 남는 건수는 같아. 달라지는 건 두 번 하는 일과 기다릴 가능성이야.']]},
  {name:'알림을 만든 서버와 화면이 SSE로 연결된 서버가 다름',intro:'지금 폴링은 모두 같은 DB를 읽어서, 요청이 어느 서버로 가도 알림이 빠지지 않아. 문제는 V2 후보인 SSE를 쓸 때 생겨.',
   cmp:['알림은 S1이 만들었는데 노트북은 S2와 SSE로 연결돼 있어. S1은 자기와 연결된 아이패드에만 알릴 수 있어서 노트북은 몰라.','Redis로 모든 서버에 알려서 두 화면 다 바로 맞춰져.'],
   steps:[['지금 폴링은 괜찮음','아이패드 요청은 S1이, 노트북 요청은 S2가 받아도 같은 DB를 읽어서 결과가 같아.'],
    ['SSE를 쓰면','V2 후보처럼 화면이 서버와 연결(SSE)을 열어. 아이패드는 S1, 노트북은 S2와 연결돼. S1이 U1의 새 알림을 저장했어.'],
    ['노트북은 모름','S1은 자기와 연결된 아이패드에만 알릴 수 있어. 노트북 연결은 S2에 있어서, S2는 새 알림이 생긴 걸 몰라.'],
    ['서버끼리 알려 주기','S1이 Redis에 "U1에게 새 알림"이라고 알려. Redis에서 듣고 있는 모두에게 한 번에 전하는 기능을 Pub/Sub이라고 해. 듣고 있는 서버가 모두 받고, 각 서버는 자기와 연결된 U1 화면에만 알려.'],
    ['같은 상황으로 다시 실행','같은 새 알림 #13이 S1에 저장돼. S1이 Redis에 알리고 S1, S2가 모두 받아.'],
    ['두 화면 모두 최신으로','각 서버가 연결된 화면에 알리고, 화면이 최신 상태를 읽어서 맞춰.'],
    ['남는 한계','Redis가 서버에 전하는 신호는 끊긴 동안 쌓아 두지 않아. 장애 중에도 바로 전달된다고 보장하지 않아. 이 복구는 ④의 "놓친 알림 되찾기"에서 봐.']]},
  {name:'서버가 나뉘어도 구독 문제는 똑같이 생김',intro:'②의 7·8·9번 구독 문제는 서버 1대에서도 생겨. 보내기는 S1, 구독 바꾸기는 S2가 맡으면 어떻게 되는지 봐.',
   cmp:['S1은 v1로 확인했는데 S2가 바꾼 v2 주소로 보내.','보낼 주소를 읽을 때 버전도 같이 봐서 안 보내.'],
   steps:[['보내기는 S1, 바꾸기는 S2','작업 #1은 v1 기준이야. S1이 버전을 확인했어.'],
    ['S2가 구독을 바꿈','S2가 아이패드의 요청을 받아 구독을 v2로 바꿔.'],
    ['결과는 서버 1대일 때와 같음','S1은 주소를 다시 읽어서 v2로 보내. 원인은 서버 수가 아니라 확인하는 위치야.'],
    ['DB 조건으로 확인','②에서 본 확인들은 DB에 조건을 거는 방식이야. 그래서 서버가 몇 대든 똑같이 지켜져.'],
    ['같은 상황으로 다시 실행','같은 순서로 다시 해. S2가 v2로 바꾼 뒤, S1이 구독을 한 번 읽고 보내지 않아.'],
    ['정리','서버를 나눈다고 새 문제가 생기는 건 아니야. 같은 확인을 모든 서버가 지키는 게 중요해.']]}
 ],
 4:[
  {name:'V2 전체 흐름 한눈에 보기',intro:'②·③에서 본 해결 장치를 하나로 이어 봐. 처음엔 큰 흐름만 보이고, 다음을 누를 때마다 장치가 하나씩 붙어.',
   steps:[['알림이 생길 일','공유 냉장고 참여나 08시 배치처럼 알림이 생길 일이 S1에서 일어나.'],
    ['변경과 알림, 할 일을 함께 저장','바뀐 내용, 알림, 받는 사람, 이어서 할 일을 한 번에 같이 저장해. ②의 1-A에서 본 빈틈을 막아.'],
    ['따로 도는 실행자가 이어서 처리','요청 처리와 따로 도는 실행자가 "할 일"을 읽어. ②의 5번에서 본 장치야. 작업을 맡을 때는 ③에서 본 "내가 맡았다" 표시를 써.'],
    ['화면 갱신과 푸시 보내기','화면은 Redis 신호를 거쳐 SSE로 알리고, 푸시는 작업을 만들어 외부 서비스로 보내. 서버끼리 알리는 건 ③에서 본 장치야.'],
    ['결과와 화면 반영 확인','푸시는 결과를 저장하고, 화면은 최신 상태를 반영한 뒤 서버에 반영 확인(ACK)을 보내. 이 확인이 와야 전달이 끝난 걸로 쳐.'],
    ['실패와 확인 없는 것 다시 처리','실패한 작업과 반영 확인이 안 온 전달은 실행자가 기록을 보고 다시 처리해. 자세한 경우는 "놓친 알림 되찾기"에서 하나씩 봐.'],
    ['장치를 처음 본 곳','실행권과 중복 막는 키는 ③의 첫 번째, 맡음 표시는 ③의 두 번째, 함께 저장은 ②의 1-A, 따로 도는 실행자는 ②의 5번, 서버끼리 알리기는 ③의 SSE, 버전 확인은 ②의 7~9번에서 봤어.']]},
  {name:'저장 직후 서버가 꺼져도 알림을 놓치지 않기',cmp:['저장 직후 서버가 꺼지면, 다른 화면에 알릴 신호가 그대로 사라져.','보낼 일을 같이 저장해 둬서 실행자가 기록을 보고 다시 보내.'],intro:'아웃박스는 "보낼 일"을 적어 두는 테이블이야. 바뀐 내용과 한 번에 같이 저장해서, 저장 직후 서버가 꺼져도 다시 처리할 수 있게 해.',
   steps:[['참여 요청','U3가 냉장고 1 참여를 요청했고 S1이 받았어. U1과 U2에게 알려야 해.'],
    ['네 가지를 한 번에 저장','참여 변경, 알림, 받는 사람, 보낼 일 #7을 한 번에 같이 저장해. 알림은 있는데 보낼 일이 없는 상태는 생기지 않아.'],
    ['저장 직후 알리기 전에 S1 꺼짐','S1이 신호를 보내기 전에 꺼졌어. 아웃박스가 없으면 여기서 신호가 사라져.'],
    ['실행자가 기록을 보고 다시 처리','실행자가 아직 처리 안 된 #7을 읽어서 Redis에 알리고 "보냄"으로 표시해.'],
    ['S2가 연결된 화면에 알림','S2가 신호를 받아서 자기와 연결된 U1 노트북과 U2 아이패드에 알리고, 화면이 최신 상태를 읽어.'],
    ['보냈다고 화면이 받은 건 아님','"보냄"은 Redis에 넘겼다는 뜻이야. 듣고 있지 않던 서버는 놓칠 수 있어서 화면의 반영 확인과 복구가 따로 필요해.'],
    ['푸시 작업과 아웃박스는 역할이 다름','기존 푸시 작업은 보내기와 재시도 기록이야. 아웃박스는 저장과 알리기 사이의 빈틈을 막는 기록이야. 역할이 달라서 무조건 합치지 않아. 08시 배치를 지금처럼 나눠 저장한다면 빠진 작업을 찾아 채우는 장치가 따로 필요해.']]},
  {name:'저장한 뒤 할 일을 누가 처리할까 (A·B 비교)',cmpL:['A · DB 작업 테이블','B · 저장형 메시지 큐'],cmp:['할 일이 DB 한 곳에 있고 워커가 맡아서 처리해. 워커가 꺼지면 기한 뒤 다른 워커가 가져가.','큐에 넣고, 받은 워커가 DB에 저장한 뒤 큐에 완료를 알려. 이 순서를 지키고 같은 번호는 한 번만 저장해.'],intro:'"보낼 일"을 실제 작업으로 바꿔 처리하는 방법은 아직 정하지 않았어. 같은 데이터와 같은 장애로 A와 B를 따라가 봐. 선택 단계로 돌아오면 다른 안을 고를 수 있어.',
   steps:[['같은 시작 조건','알림 하나가 저장됐고, 아웃박스에 "이 알림을 화면과 푸시로 전달해야 함" 기록이 남아 있어. 이 기록 번호를 #e1이라고 할게. 이 기록을 누가 실제 작업으로 바꿔 처리하는지가 A와 B의 차이야. 두 방식 모두 처리하던 프로그램이 도중에 한 번 꺼지는 상황을 똑같이 넣어서 비교해.'],
    ['A와 B 중 고르기','아래에서 A나 B를 골라. 안 고르면 A로 가. 다음을 누르면 고른 안을 끝까지 따라가.']],
   branch:{A:{name:'A · DB 작업 테이블',desc:'할 일을 DB에 두고 워커가 맡아 처리',steps:[
     ['할 일 저장','독립 실행자가 아웃박스의 #e1 기록을 읽어서, DB 작업 테이블에 "화면에 알리기"와 "푸시 보내기" 작업을 저장해.'],
     ['워커가 찾아서 맡음','작업을 가져가서 실제로 처리하는 프로그램을 워커라고 해. 워커 1이 작업을 찾아 "워커 1이 08:05까지 맡음"으로 표시해.'],
     ['처리 중 워커 꺼짐','워커 1이 처리하다 꺼졌어. 작업은 맡은 표시가 된 채로 DB에 남아.'],
     ['기한이 지나 다른 워커가 가져감','맡은 기한이 지나면 다른 워커가 다시 맡아. 같은 DB 기록을 보고 이어서 해.'],
     ['처리하고 결과 저장','워커 2가 화면 알림 신호를 보내고 푸시를 보낸 뒤 결과를 저장해. 실패하면 다시 보낼 시각을 적어.'],
     ['A의 특징','할 일이 DB 한 곳에만 있어. 큐 완료 같은 단계가 없어. 새로 운영할 장치는 없지만, 워커가 DB를 자주 조회해서 그 부담은 재 봐야 해.']]},
    B:{name:'B · 저장형 메시지 큐',desc:'큐에 넣고 받는 워커가 DB에 저장',steps:[
     ['큐에 넣기','독립 실행자가 아웃박스의 #e1 기록을 읽어서 메시지 큐에 넣어. 메시지 큐는 받는 쪽이 "다 처리했다"고 알릴 때까지 메시지를 지우지 않고 보관하는 장치야.'],
     ['받는 워커가 꺼냄','큐에서 #e1을 꺼내 처리하는 프로그램을 워커라고 해. 그림에서는 독립 실행자 상자가 넣기와 꺼내기를 둘 다 맡아. 실제로는 같은 서버여도 되고 다른 서버여도 돼.'],
     ['저장 전에 "완료"를 하면','순서를 잘못 잡아서, DB에 저장하기 전에 큐에 "완료"를 먼저 알리고 워커가 꺼졌다고 해 보자. #e1은 큐에서도 DB에서도 사라져. 그래서 이 순서는 쓰지 않아.'],
     ['저장한 뒤 "완료"','올바른 순서로 다시 해. 받는 워커가 #e1을 이벤트 번호를 키로 DB에 저장한 뒤 큐에 "완료"를 알려.'],
     ['저장했는데 "완료" 전에 꺼짐','이번에는 DB에 저장한 뒤 "완료"를 알리기 전에 워커가 꺼졌어. 큐가 #e1을 다시 줘.'],
     ['같은 번호라 두 번 저장 안 됨','같은 이벤트 번호라서 DB에 두 번 저장되지 않아. 이걸 멱등 저장이라고 해. 이번에는 "완료"까지 끝내.'],
     ['실제 처리는 A와 같음','실제 화면 알림과 푸시는 DB 작업을 맡아서 처리해. 이 부분은 A와 같아.'],
     ['B의 특징','할 일이 큐와 DB 두 곳에 걸쳐 있어. 큐의 "완료"가 화면에 보였다는 뜻은 아니야. 큐를 운영하고 설정할 일이 더 생겨. 어떤 큐를 쓸지, 쓸지 말지, 비용과 성능은 아직 정하지 않았어.']]}}},
  {name:'한 기기에서 읽으면 내 다른 기기에도 반영하기',cmp:['지금은 내 다른 기기가 다음 30초 확인 때까지 안 읽음으로 보여.','U1의 다른 기기에만 바로 알려서 읽음으로 맞추고, U2는 그대로 둬.'],intro:'U1이 아이패드에서 알림을 읽으면 U1 노트북에도 읽음으로 보여야 하고, U2는 그대로여야 해.',
   steps:[['읽음 저장과 변경 기록','U1이 아이패드에서 읽었어. S1이 U1의 받는 사람 기록을 읽음으로 바꾸고, "U1 읽음 변경 #r3"도 같이 저장해.'],
    ['U1 대상 신호','실행자가 #r3을 읽어 "U1의 읽음이 바뀌었다"는 신호를 Redis에 보내. 신호에는 누구의 무엇이 바뀌었는지만 담아.'],
    ['서버가 대상과 자기 연결 확인','듣고 있는 서버가 모두 신호를 받아. 각 서버가 대상 사용자와 자기 연결을 비교해. S2에는 U1 노트북 연결이 있고, U2 아이패드는 대상이 아니야. 누구에게 보낼지는 Redis가 아니라 서버가 판단해.'],
    ['알림 받고 최신 상태 읽기','S2가 노트북에 알리고, 노트북은 최신 상태를 읽어서 미읽음 0으로 맞춰. SSE는 서버에서 화면으로만 가고, 읽음과 반영 확인은 화면이 따로 요청으로 보내.'],
    ['기기별 반영 확인','노트북이 #r3을 반영했다고 반영 확인(ACK)을 보내. 이건 사람이 읽었다는 뜻이 아니라 화면에 반영했다는 뜻이야. 기기마다 따로 기록하고, 한 기기의 확인이 다른 기기를 대신하지 않아.'],
    ['U2와 푸시','U2의 미읽음 1은 그대로야. 읽음이 바뀔 때마다 푸시를 보내지 않아. 알림이 생겼을 때의 반영 확인이 나중 읽음 변경까지 끝난 걸로 치지 않아.']]},
  {name:'놓친 알림 되찾기 ① 서버끼리 주고받는 신호가 잠깐 끊김',cmp:['S2가 신호를 놓쳐서 노트북이 새 알림을 몰라.','다시 연결될 때 다시 확인하라고 알리고, 실행자가 확인 안 된 전달을 다시 보내.'],intro:'S2와 Redis 사이만 끊기고, 노트북과 S2 연결은 멀쩡한 경우야. Redis는 끊긴 동안의 신호를 다시 주지 않아.',
   steps:[['S2만 신호를 못 들음','S2와 Redis 사이 연결이 잠깐 끊겼어. 노트북과 S2 연결은 정상이야.'],
    ['끊긴 동안 보낸 신호','새 알림 #8이 저장되고 신호가 나갔어. S2는 못 받아. 노트북 전달 기록은 "확인 안 됨"으로 남아.'],
    ['다시 연결되면 "다시 확인해"','S2는 다시 연결돼도 놓친 신호가 있었는지 몰라. 그래서 자기와 연결된 화면 모두에 다시 확인하라고 알려.'],
    ['실행자가 확인 안 된 걸 다시 보냄','그래도 남은 "확인 안 됨"은 실행자가 찾아서 신호를 다시 보내. 두 장치가 서로 다른 빈틈을 메워.'],
    ['반영하고 확인 보내기','노트북이 최신 상태를 읽고 #8에 대해 반영 확인을 보내.']]},
  {name:'놓친 알림 되찾기 ② 화면은 갱신됐는데 서버가 그 사실을 확인하지 못함',cmp:['반영 확인이 사라져서 서버는 전달이 끝났는지 몰라.','다시 알리되 화면은 최신 상태로 맞춰서 알림이 두 번 보이지 않고, 이번 확인은 기록돼.'],intro:'V2에서는 화면이 최신 상태를 반영하고 그 사실을 서버에 알려야(반영 확인, ACK) 전달이 끝난 걸로 쳐. 화면은 갱신됐는데 이 확인이 중간에 사라진 경우야. 다시 알리더라도 같은 알림이 두 번 보이면 안 돼.',
   steps:[['알림 받고 반영','U1 아이패드가 #9 알림을 받아서 최신 상태를 읽고 보여 줬어.'],
    ['반영 확인이 사라짐','화면이 반영 확인을 보냈는데 중간에 사라졌어. 서버 기록에는 아직 "확인 안 됨"이라 전달이 끝났는지 몰라.'],
    ['실행자가 다시 알림','실행자가 "확인 안 됨"인 #9를 찾아 다시 신호를 보내.'],
    ['덧붙이지 않고 최신으로 맞춤','화면은 받은 알림을 목록에 덧붙이지 않고 최신 상태를 다시 읽어서 맞춰. 그래서 #9가 두 번 보이지 않아. 이번 반영 확인은 기록돼서 전달이 끝난 걸로 쳐.']]},
  {name:'놓친 알림 되찾기 ③ 기기가 꺼져 있었음',cmp:['꺼진 기기에는 알릴 방법이 없어.','계속 다시 보내지 않고, 다시 켜질 때 최신 상태로 맞춰.'],intro:'U2 아이패드가 꺼져 있는 동안 알림이 생긴 경우야. 꺼진 기기에 계속 다시 보내지는 않아.',
   steps:[['U2 아이패드 꺼짐','U2 아이패드가 꺼져 있어.'],
    ['알림 저장 · 확인 안 됨','새 알림이 저장되고 U2 아이패드 전달 기록은 "확인 안 됨"이야. 연결이 없으니 계속 다시 보내지 않아.'],
    ['다시 켜지면 최신 상태로','U2 아이패드가 다시 접속하면 연결을 맺고 바로 최신 상태를 읽어서 맞춰. 지금 쓰는 냉장고만 보여 주는 방식은 그대로야.'],
    ['아직 정하지 않은 것','기기 연결을 어떻게 구분할지, "확인 안 됨" 기록을 얼마나 둘지는 아직 정하지 않았어.']]},
  {name:'놓친 알림 되찾기 ④ 늦게 온 예전 응답이 읽음을 되돌리려 함',cmp:['늦게 온 예전 답이 읽은 알림을 다시 안 읽음으로 되돌려.','더 오래된 버전의 답은 버려서 읽음이 유지돼.'],intro:'조회 응답이 순서가 바뀌어 도착해도, 이미 읽은 알림을 다시 안 읽음으로 되돌리면 안 돼.',
   steps:[['조회 ① 출발','노트북이 최신 상태를 물어봤어. 이 답은 "버전 5, 미읽음 1"인데 늦게 도착해.'],
    ['그 사이 읽음, 조회 ②','그 사이 U1이 아이패드에서 읽어서 버전 6이 됐어. 노트북이 다시 물어본 ②의 답이 먼저 도착했어.'],
    ['예전 답 ① 도착','버전 5 답이 늦게 도착했어. 그대로 덮으면 미읽음 1로 되돌아가.'],
    ['더 오래된 버전은 버림','화면은 이미 가진 버전 6보다 오래된 답은 반영하지 않아. 미읽음 0이 유지돼.']]},
  {name:'놓친 알림 되찾기 ⑤ 처리하던 실행자가 꺼짐',cmp:['신호를 보내고 "보냄" 표시 전에 꺼지면, 그 일이 끝났는지 기록에 남지 않아.','남은 기록에서 다시 하고, 화면은 최신 상태로 맞춰서 목록이 두 번 늘지 않아.'],intro:'보낼 일을 처리하던 실행자가 도중에 꺼진 경우야.',
   steps:[['#7 처리 시작','실행자가 #7을 읽어서 처리하기 시작했어.'],
    ['보낸 뒤 표시 전에 꺼짐','실행자가 Redis에 신호는 보냈는데 "보냄"으로 표시하기 전에 꺼졌어. DB에는 #7이 아직 "대기"야.'],
    ['남은 기록에서 다시 시작','다시 켜진 실행자가 "대기"로 남은 #7을 다시 처리해. 같은 신호가 두 번 갈 수 있지만, 화면은 최신 상태를 다시 읽는 방식이라 목록이 두 번 늘지 않아.']]},
  {name:'푸시 보내기와 알림 보관',cmp:['옛 구독으로 보내기, 두 번 보내기, 결과 모름이 섞이면 푸시 상태를 믿기 어려워.','맡음 표시, 구독 버전 확인, 결과 모름 기록, 처리량 제한을 차례로 거쳐.'],intro:'푸시는 작업 만들기부터 결과 저장까지 ②·③의 장치를 차례로 거쳐. 보관과 처리량 정책도 같이 봐.',
   steps:[['작업 만들고 맡기','실행자가 푸시 작업을 만들고, 보낼 때는 "내가 맡음"으로 표시해.'],
    ['구독이 살아 있고 버전이 맞는지','실제로 보낼 구독을 읽을 때 켜져 있는지와 버전을 같이 확인해. 다르면 취소해.'],
    ['외부로 보내기','외부 서비스로 보내. 서비스가 받았다고 해도 휴대폰에 실제로 떴다는 뜻은 아니야.'],
    ['결과와 재시도 저장','결과를 저장할 때 아직 내가 맡은 게 맞는지 확인해. 실패면 다시 보낼 시각을 적어. "구독 없음"(404·410)은 보낸 버전이 같을 때만 구독에 반영해.'],
    ['감추지 않는 "결과 모름"','외부는 성공했는데 결과 저장이 실패하면 "결과 모름"으로 남겨. 다시 보내면 두 번 갈 수 있다는 걸 알고 처리해.'],
    ['한 번에 처리하는 양 제한','작업 찾기, 만들기, 보내기, 복구를 모두 정한 양만큼만 해. 숫자는 실험해서 정해.'],
    ['보관','03시 정리는 실행권으로 한 서버만 해. 화면에 보여 줄 99개와, 복구용 "확인 안 됨" 기록을 얼마나 둘지는 따로 생각해. 보관 기간은 아직 정하지 않았어.']]}
 ]
};
(function(){const L={2:S2L,3:S3L,4:S4L};
 for(const k in TXT){TXT[k].forEach((t,i)=>{const s=L[k][i];if(!s)throw new Error('no scenario '+k+'.'+i);s.name=t.name;s.intro=t.intro;if(t.cmp)s.cmp=t.cmp;if(t.cmpL)s.cmpL=t.cmpL;
  if(t.steps.length!==s.steps.length)throw new Error('step count '+k+'.'+i+' '+t.steps.length+'≠'+s.steps.length);
  t.steps.forEach(([c,d],j)=>{s.steps[j].c=c;s.steps[j].d=d});
  if(t.branch)['A','B'].forEach(ab=>{const tb=t.branch[ab],sb=s.branch[ab];sb.name=tb.name;sb.desc=tb.desc;
    if(tb.steps.length!==sb.steps.length)throw new Error('branch count '+k+'.'+i+ab);tb.steps.forEach(([c,d],j)=>{sb.steps[j].c=c;sb.steps[j].d=d})})})}})();

/* ---------- controller ---------- */
const PH={norm:['p-norm','정상'],prob:['p-prob','문제'],obs:['p-obs','관찰'],fix:['p-fix','해결 장치'],re:['p-re','다시 실행'],sum:['p-sum','정리'],flow:['p-norm','흐름'],br:['p-fix','선택']};
const TAGN={code:['code','코드 확인'],risk:['risk','구조적 위험'],perf:['perf','성능 가설'],sol:['sol','해결 후보'],plan:['sol','V2 계획']};
const CLSN={now:'지금 구조에 반영',perf:'후속 성능 검증',fix:'후속 개별 수정',front:'프론트 담당 영역'};
const SS=SCREENS.map(()=>({sc:0,i:-1,ab:'A'}));
let cur=0;
const scr=()=>SCREENS[cur],sst=()=>SS[cur],scen=()=>scr().list[sst().sc];
function stepsOf(){const s=scen();return s.branch?s.steps.concat(s.branch[sst().ab].steps):s.steps}
const vkey=()=>scen().branch?sst().ab:'-';
const posKey=s=>cur+':'+s.scene+':'+(s.opt&&s.opt.single?'s':'m');
const USED={};
function build(mode){[NODES,EDGES,PK,TAGS,CONNS].forEach(g=>g.innerHTML='');N={};E={};R={};const s=scen(),k=posKey(s);
  if(mode==='raw'){buildScene(s.scene,s.opt||{},null);Object.keys(N).forEach(id=>setVis(id,s.show.includes(id)));updEdges();return}
  buildScene(s.scene,s.opt||{},USED[k]||null,k);const fv=(s.vis||{})[vkey()];Object.keys(N).forEach(id=>setVis(id,fv?fv.has(id):s.show.includes(id)));updEdges()}
async function computeUsed(){const s0=scen(),k=posKey(s0);if(USED[k])return;const st0=sst(),keep=[st0.sc,st0.ab];const U=new Set();
  const list=scr().list;for(let i=0;i<list.length;i++){const sc=list[i];if(posKey(sc)!==k)continue;for(const ab of sc.branch?['A','B']:['-']){
    st0.sc=i;if(ab!=='-')st0.ab=ab;const t={dead:false,fast:true};tok=t;build('raw');try{for(const x of stepsOf())await x.run()}catch(e){if(e!==STOP)throw e}
    const v=new Set(Object.keys(N).filter(id=>N[id].vis));sc.vis=sc.vis||{};sc.vis[sc.branch?ab:'-']=v;v.forEach(id=>U.add(id))}}
  st0.sc=keep[0];st0.ab=keep[1];USED[k]=U}
function hl(step,edges){Object.keys(N).forEach(id=>{if(!N[id].isConn)N[id].g.classList.toggle('on',!!step&&step.n.includes(id))});
  Object.keys(E).forEach(id=>{const e=E[id];const on=!!edges&&!!step&&step.e.includes(id)&&!e.p.classList.contains('dim');e.p.classList.toggle('on',on);
    if(on){e.t.textContent=e.label;fitTag(id)}e.tg.classList.toggle('show',on&&!!e.label)});declutter()}
function setWhat(text){const box=$('nows');box.innerHTML='';const ul=document.createElement('ul');ul.className='flow';
  text.split(/(?<=[.?!])\s+/).filter(Boolean).forEach(line=>{const li=document.createElement('li');li.textContent=line;ul.appendChild(li)});box.appendChild(ul)}
function renderList(){const L=$('list');L.innerHTML='';const steps=stepsOf(),i=sst().i;let lastp=null;
  steps.forEach((s,j)=>{
    const li=document.createElement('li');li.className=j<i?'done':j===i?'on':'';li.innerHTML='<b>'+(j+1)+'</b><span></span>';li.lastChild.textContent=s.c;
    li.tabIndex=0;li.title='이 단계로 이동';li.onclick=()=>{if(!auto)paused=false;goTo(j)};li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goTo(j)}};L.appendChild(li);
    if(j===i)setTimeout(()=>{const top=li.offsetTop-L.offsetTop;if(top<L.scrollTop||top>L.scrollTop+L.clientHeight-40)L.scrollTop=Math.max(0,top-80)},0)})}
function renderChips(){const c=$('chips');c.innerHTML='';const s=scen();
  (s.tags||[]).forEach(t=>{const sp=document.createElement('span');sp.className='chip '+TAGN[t][0];sp.textContent=TAGN[t][1];c.appendChild(sp)});
  (s.cls||[]).forEach(t=>{const sp=document.createElement('span');sp.className='chip cls';sp.textContent=CLSN[t];c.appendChild(sp)})}
function renderStepUI(){const steps=stepsOf(),i=sst().i,s=scen();const ab=$('abrow');ab.hidden=true;
  $('prev').disabled=i<0;$('next').disabled=i>=steps.length-1;$('next').textContent=i<0?'시작':'다음';
  if(i<0){$('nowk').innerHTML='';$('nowk').textContent=steps.length+'단계';$('nowc').textContent=s.name;setWhat(s.intro);$('whatbox').classList.add('idle')}
  else{const st=steps[i];const k=$('nowk');k.innerHTML='';const ph=document.createElement('span');ph.className='ph '+PH[st.p][0];ph.textContent=PH[st.p][1];k.appendChild(ph);
    k.appendChild(document.createTextNode((i+1)+' / '+steps.length));$('nowc').textContent=st.c;setWhat(st.d);$('whatbox').classList.remove('idle');
    if(st.p==='br'&&s.branch){ab.hidden=false;ab.innerHTML='';['A','B'].forEach(k2=>{const b=document.createElement('button');b.className=sst().ab===k2?'sel':'';
      b.innerHTML='<b></b><span></span>';b.firstChild.textContent=s.branch[k2].name;b.lastChild.textContent=s.branch[k2].desc;
      b.onclick=()=>{sst().ab=k2;renderList();renderStepUI();renderCanvasNote()};ab.appendChild(b)})}}
  renderList();renderPhases();renderCmp();renderInfo()}
function renderInfo(){const b=$('info'),s=scen();b.innerHTML='';const t=document.createElement('span');const k=document.createElement('b');k.textContent='상황 ';t.appendChild(k);t.appendChild(document.createTextNode(s.intro||''));b.appendChild(t)}
function macro(p){return p==='fix'?2:(p==='re'||p==='sum')?3:1}
function renderPhases(){const box=$('phases');box.innerHTML='';const st=stepsOf(),i=sst().i,m=i<0?0:macro(st[i].p);box.hidden=!st.some(x=>x.p==='re');if(box.hidden)return;
  [['문제',1],['해결 장치',2],['다시 실행',3]].forEach(([l,k],n)=>{if(n){const a=document.createElement('span');a.className='ar';a.textContent='→';box.appendChild(a)}
    const s=document.createElement('span');s.className='pp p'+k+(k===m?' on':k<m?' done':'');s.textContent=l;box.appendChild(s)})}
function renderCmp(){const box=$('cmp'),s=scen();if(!s||!s.cmp){box.hidden=true;return}box.hidden=false;const st=stepsOf(),i=sst().i;
  const L=s.cmpL||['문제','해결책'];$('cmpLa').textContent=L[0];$('cmpLb').textContent=L[1];$('cmpA').textContent=s.cmp[0];box.classList.toggle('ab',!!s.cmpL);$('cmpB').textContent=s.cmp[1];
  let a=false,b=false;if(s.cmpL){if(i>=0&&st[i].p!=='br'&&i>=s.steps.length){a=sst().ab==='A';b=!a}}
  else if(i>=0){const p=st[i].p;a=p==='prob'||p==='obs';b=p==='fix'||p==='re'}
  box.querySelector('.bf').classList.toggle('on',a);box.querySelector('.af').classList.toggle('on',b)}
function renderCanvasNote(){}
function bboxView(){const a=NODES.getBBox(),b=EDGES.getBBox();if(!a.width)return null;let x0=Math.min(a.x,b.width?b.x:a.x)-24;let y0=Math.min(a.y,b.height?b.y:a.y)-24,x1=Math.max(a.x+a.width,b.x+b.width)+24;let y1=Math.max(a.y+a.height,b.y+b.height)+24;
  Object.keys(E).forEach(k=>{const e=E[k];if(e.p.classList.contains('hide')||e.p.classList.contains('dim')||!e.label)return;const t0=e.t.textContent;e.t.textContent=e.label;fitTag(k);const rx=+e.r.getAttribute('x'),rw=+e.r.getAttribute('width'),ry=+e.r.getAttribute('y');e.t.textContent=t0;if(t0)fitTag(k);if(!rw)return;
    x0=Math.min(x0,rx-50);x1=Math.max(x1,rx+rw+50);y0=Math.min(y0,ry-12);y1=Math.max(y1,ry+36)});
  let w=x1-x0,h=y1-y0;const mw=1280,mh=640;let X=x0,Y=y0;if(w<mw){X-=(mw-w)/2;w=mw}if(h<mh){Y-=(mh-h)/2;h=mh}return X+' '+Y+' '+w+' '+h}
async function fitOf(){const s=scen(),key=s.branch?sst().ab:'-';s.fit=s.fit||{};if(s.fit[key])return s.fit[key];
  await computeUsed();const t={dead:false,fast:true};tok=t;
  build();try{for(const st of stepsOf()){if(t.dead)break;await st.run()}}catch(e){if(e!==STOP&&!t.dead)throw e}
  if(t.dead)return null;let v=null;try{v=bboxView()}catch(e){}s.fit[key]=v;return v}
let goSeq=0;
async function goTo(i,quiet){tok.dead=true;const my=++goSeq;const fit=await fitOf();if(my!==goSeq)return;const t={dead:false,fast:true};tok=t;sst().i=i;build();if(fit){const p=fit.split(' ').map(Number);const w=Math.max(p[2],600);SVG.setAttribute('viewBox',p[0]+' '+p[1]+' '+w+' '+p[3]);}renderStepUI();const steps=stepsOf();
  try{for(let j=0;j<i;j++){if(t.dead)return;await steps[j].run()}if(t.dead)return;
    if(i>=0){if(!quiet)t.fast=false;hl(steps[i]);if(!quiet&&!steps[i].e.length)steps[i].n.forEach(id=>{const n=N[id];if(n&&!n.isConn){n.g.classList.remove('pulse');void n.g.getBoundingClientRect();n.g.classList.add('pulse')}});const t0=performance.now();FLOWN=0;REC=t.fast?[]:null;await steps[i].run();const rec=REC;REC=null;if(!t.dead){if(rec&&rec.length)rec.forEach(([k,lab])=>{if(lab)tag(k,lab);else E[k].p.classList.add('on');if(E[k].isConn)E[k].p.classList.add('flow')});else if(t.fast||FLOWN===0)hl(steps[i],1)}
      if(auto&&!t.dead){if(i>=steps.length-1){auto=false;paused=false;btnPlay();return}
        const v=(performance.now()-t0)*speed;await wait(Math.max(1800,4800-v));if(!t.dead&&auto)goTo(i+1)}}else hl(null)}
  catch(e){if(e!==STOP&&!t.dead)throw e}}
function btnPlay(){$('play').textContent=auto&&!paused?'일시정지':'재생'}
function manual(f){return()=>{auto=false;paused=false;btnPlay();f()}}
function renderScreen(){$('legacy').hidden=true;$('main').hidden=false;const S=scr();
  document.querySelectorAll('#scr button').forEach((b,k)=>b.classList.toggle('sel',k===cur));
  document.querySelectorAll('#dlist button').forEach((b,k)=>b.classList.toggle('sel',k===cur));
  $('stitle').textContent=S.title;$('slede').textContent=S.lede;
  const sel=$('sel');sel.innerHTML='';S.list.forEach((s,k)=>{const o=document.createElement('option');o.value=k;o.textContent=s.name;sel.appendChild(o)});sel.value=sst().sc;
  renderChips();goTo(sst().i,true)}
function goScreen(k){auto=false;paused=false;btnPlay();cur=k;try{localStorage.setItem('dmz-sim',String(k))}catch(e){}if(location.hash!=='#s'+(k+1))history.replaceState(null,'','#s'+(k+1));renderScreen()}
SCREENS.forEach((S,k)=>{const b=document.createElement('button');b.textContent=S.chip;b.onclick=()=>k===0?goLegacy():goScreen(k);if(k===0)b.dataset.legacy='1';$('scr').appendChild(b);
  const d=document.createElement('button');d.innerHTML='<b></b><span></span>';d.firstChild.textContent=S.title;d.lastChild.textContent=S.menu;d.onclick=()=>{k===0?goLegacy():goScreen(k);setOpen(false)};$('dlist').appendChild(d)});
function goLegacy(){auto=false;paused=false;btnPlay();tok.dead=true;cur=-1;
  document.querySelectorAll('#scr button').forEach(b=>b.classList.toggle('sel',b.dataset.legacy==='1'));document.querySelectorAll('#dlist button').forEach((b,k)=>b.classList.toggle('sel',k===0));
  const f=$('legacy');if(!f.getAttribute('src'))f.setAttribute('src','legacy.html');f.hidden=false;$('main').hidden=true;
  try{localStorage.setItem('dmz-sim','0')}catch(e){}history.replaceState(null,'','#s1')}
function setOpen(v){document.body.classList.toggle('open',v);$('ham').setAttribute('aria-expanded',v);if(v){const s=$('dlist').querySelector('.sel');s&&s.focus()}}
$('ham').onclick=()=>setOpen(!document.body.classList.contains('open'));$('shade').onclick=()=>setOpen(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
$('sel').onchange=e=>{auto=false;paused=false;btnPlay();const st=sst();st.sc=+e.target.value;st.i=-1;st.ab='A';renderChips();goTo(-1)};
$('prev').onclick=manual(()=>{if(sst().i>-1)goTo(sst().i-1)});
$('next').onclick=manual(()=>{if(sst().i<stepsOf().length-1)goTo(sst().i+1)});
$('home').onclick=manual(()=>goTo(-1));
$('speed').onchange=e=>{speed=+e.target.value};
$('play').onclick=()=>{if(!auto){auto=true;paused=false;btnPlay();const n=stepsOf().length;goTo(sst().i>=n-1?0:sst().i+1);return}paused=!paused;btnPlay()};
(function(){let k=0;const h=location.hash.match(/^#s([1-4])$/);if(h)k=+h[1]-1;else{try{const s=localStorage.getItem('dmz-sim');const v=+s;if(v>=0&&v<4)k=v}catch(e){}}if(k===0)goLegacy();else goScreen(k)})();

</script>
</body></html>
