<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 SSE 서버별 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 상황 탭 → 지금 호출 한 줄 → 서버 1 트랜잭션(위) · Redis · 서버 3대(아래, 서버마다 연결 목록) → ⓘ 설명 */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1f2328; --ink2:#59636e; --ink3:#8c959f; --line:#d8dee4; --soft:#f6f8fa; --grid:#eef1f4;
  --be-f:#e6f6ee; --be-s:#1f9d6c; --db-f:#efe8fc; --db-s:#7c4dde; --bus-f:#fff0e4; --bus-s:#e0621c; --fe-f:#e5f5fa; --fe-s:#1a8db0; --grp:#fffcf4; --grp-s:#d98a1a;
  --cur:#c2571a; --wrk:#2b66c9; --io:#8250df; --bad:#cf222e; --bad-bg:#ffebe9; --ok:#1a7f37; --ok-bg:#e6f4ea; --hd:#e7eefc; --line2:#b9c2cc;
  --shadow:0 6px 24px rgba(31,35,40,.14);
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --card:#0d1117; --ink:#e6edf3; --ink2:#9da7b3; --ink3:#6e7781; --line:#30363d; --soft:#161b22; --grid:#21262d;
  --be-f:#0f2a20; --be-s:#2fbf8f; --db-f:#231a3a; --db-s:#a77bff; --bus-f:#3a2214; --bus-s:#ff8a4c; --fe-f:#0f2830; --fe-s:#38bdd8; --grp:#15130c; --grp-s:#c77a1a;
  --cur:#d0662c; --wrk:#5a8ae0; --io:#a371f7; --bad:#ff7b72; --bad-bg:#3a1d1d; --ok:#56d364; --ok-bg:#12261a; --hd:#16233a; --line2:#4a535d;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#0d1117; --ink:#e6edf3; --ink2:#9da7b3; --ink3:#6e7781; --line:#30363d; --soft:#161b22; --grid:#21262d;
  --be-f:#0f2a20; --be-s:#2fbf8f; --db-f:#231a3a; --db-s:#a77bff; --bus-f:#3a2214; --bus-s:#ff8a4c; --fe-f:#0f2830; --fe-s:#38bdd8; --grp:#15130c; --grp-s:#c77a1a;
  --cur:#d0662c; --wrk:#5a8ae0; --io:#a371f7; --bad:#ff7b72; --bad-bg:#3a1d1d; --ok:#56d364; --ok-bg:#12261a; --hd:#16233a; --line2:#4a535d;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;word-break:keep-all}
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.lead{color:var(--ink2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.fig{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
.ctl button{font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;padding:3px 12px;cursor:pointer}
button:focus-visible,.ib:focus-visible{outline:2px solid var(--wrk);outline-offset:2px}
.where{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;min-height:30px}
.badge{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:0 10px;font-weight:600;font-size:12.5px;white-space:nowrap}
.call{font-family:var(--f-num);font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.dia{overflow-x:auto}
#map{width:100%;min-width:860px;height:auto;display:block}
svg text{font-family:var(--f-ui)}
svg .mono{font-family:var(--f-num)}
#map [data-id]{cursor:help}
.stage{display:grid;grid-template-columns:272px minmax(0,1fr);gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:12px}
.hd{background:var(--hd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hd .sub{font-size:12.5px;font-weight:700;color:var(--wrk)}
.hd .ttl{font-size:18px;font-weight:700;line-height:1.4;text-wrap:balance}
.hd .badge{align-self:flex-start;margin-top:4px}
.now{border:1.5px dashed var(--line2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.now h4{margin:0;font-size:13px;color:var(--wrk)}
.now ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.now li{display:grid;grid-template-columns:18px 1fr;gap:4px;font-size:13.5px;line-height:1.6}
.now li::before{content:"→";color:var(--ink3)}
.now .code{font-family:var(--f-num);font-size:11.5px;color:var(--ink);background:var(--soft);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.now .src{font-family:var(--f-num);font-size:11px;color:var(--ink3);overflow-wrap:anywhere}
.why{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--ink2);line-height:1.65}
.why b{color:var(--ink);margin-right:6px}
.why span{color:var(--ink3)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.steps button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink3);cursor:pointer;line-height:1.5}
.steps button:hover{background:var(--soft)}
.steps button:focus-visible{outline:2px solid var(--wrk)}
.steps button i{font-style:normal;font-family:var(--f-num);font-weight:600}
.steps .done button{color:var(--ink2)}
.steps .cur button{background:var(--hd);color:var(--ink);font-weight:700}
.steps .cur button i{color:var(--wrk)}
.lsth{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
@media (max-width:980px){.stage{grid-template-columns:1fr}.side{position:static}}
.key{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink3);justify-content:center}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--ink)}
.key i.sq{border-radius:2px;background:var(--bus-s)}
.key i.rq{background:none;border:2px solid var(--cur)}
.key i.ev{background:var(--ok);width:8px;height:8px}
.cap{font-size:13.5px;color:var(--ink2);text-align:center;min-height:2.8em;display:flex;align-items:center;justify-content:center;gap:6px}
.ib{font-style:normal;color:var(--ink3);cursor:help;flex:none}
.ib:hover{color:var(--ink)}
.card{position:fixed;z-index:10;max-width:340px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.card.on{opacity:1;transform:none}
.card b{display:block;font-family:var(--f-num);font-size:12px;overflow-wrap:anywhere}
.card p{color:var(--ink2)}
@media (max-width:600px){.wrap{padding-inline:8px}.fig{padding:12px 8px}}
body.embed h1,body.embed .lead,body.embed .tabs{display:none}
body.embed .wrap{padding-block:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>알림 SSE 서버별 흐름</h1>
  <p class="lead" id="lead"></p>
  <div class="tabs" role="group" aria-label="상황" id="tabs"></div>
  <div class="fig">
    <div class="ctl">
      <button id="play">일시정지</button>
      <button id="again">처음부터</button>
      <button id="speed" aria-label="재생 속도">속도 0.5×</button>
      <span>서버 3대 · 냉장고 17 (A·B 공유) · PR #241~#245</span>
    </div>
    <div class="stage">
      <aside class="side" aria-live="polite">
        <div class="hd"><span class="sub" id="hsub"></span><span class="ttl" id="httl"></span><span class="badge" id="badge"></span></div>
        <div class="now"><h4>지금 하는 일</h4><ul id="nowl"></ul><div class="code" id="call"></div><div class="src" id="src"></div></div>
        <div class="why" id="why"></div>
        <div class="lst"><h4 class="lsth">단계 목록</h4><ol class="steps" id="steps"></ol></div>
      </aside>
      <div class="dia"><svg id="map" viewBox="0 0 1100 652" role="img" aria-label="서버별 알림 SSE 흐름"></svg></div>
    </div>
    <div class="key">
      <span><i></i>변경 사건 (사용자·냉장고)</span>
      <span><i class="sq"></i>Redis로 오가는 바이트</span>
      <span><i class="rq"></i>HTTP 요청</span>
      <span><i class="ev"></i>SSE 이벤트</span>
    </div>
  </div>
</div>
<div class="card" id="card" role="tooltip"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2,cl=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,t)=>a+(b-a)*t;

/* ===== 고정 배치 ===== */
const TOP={DB:{x:24,y:40,w:132,h:60},SAVE:{x:192,y:40,w:178,h:60},EVENT:{x:410,y:40,w:200,h:60},PUB:{x:660,y:40,w:188,h:60},RED:{x:884,y:40,w:196,h:60}};
const PX=i=>20+i*360,PW=340,PY=246,PH=330,DY=592,DH=46;
const CX=i=>PX(i)+PW/2;
const GATE=[635,70];
const CD={
 DB:['notifications · notification_recipients','알림 내용과 수신자별 readAt을 보관해요. 커밋 전 변경은 점선으로 보여요.'],
 SAVE:['ExpirationNotificationService.generate → NotificationRecipientService.saveRecipients\nNotificationService.readNotification → markRead','알림·수신자 저장이나 읽음 변경이 일어나는 곳이에요. @Transactional 안이에요.'],
 EVENT:['ApplicationEventPublisher.publishEvent(NotificationChanged)','@TransactionalEventListener라서 커밋될 때까지 사건을 보관만 해요. 롤백되면 버려요.'],
 PUB:['NotificationRedisPubSub.afterCommit','커밋 뒤 같은 스레드에서 실행돼요. mapper.writeValueAsString → StringRedisTemplate.convertAndSend. 실패하면 로그만 남겨요.'],
 RED:['Redis PUBLISH · fridgely:notifications:changed','구독한 서버마다 복사해 보내요. 저장하거나 다시 보내지 않아요.'],
 ONM:['NotificationRedisPubSub.onMessage','서버마다 RedisMessageListenerContainer가 구독해 두고, 실행기 스레드에서 호출해요. byte[] → String → NotificationChanged → connections.notifyChanged.'],
 MAP:['NotificationSseConnections','Map<Long, UserSseConnections> (ConcurrentHashMap). 서버 메모리에만 있어서 서버마다 내용이 달라요. 등록은 compute, 제거는 computeIfPresent.'],
 G:['UserSseConnections','한 사용자의 Set<NotificationSseConnection>. 연결마다 sendChanged를 부르고, 실패한 연결만 빼요.'],
 C:['NotificationSseConnection','(userId, refrigeratorId, emitter). accepts는 두 ID가 다 같을 때만 true예요.'],
 DEV:['브라우저 · EventSource','connected·notifications-changed 를 받으면 목록과 미읽음 수를 다시 조회해요.']};

/* ===== 장면 만들기: 시간순으로 쌓으면서 연결 상태를 같이 계산 ===== */
const DEVS={AN:{s:0,n:'A 노트북',u:7,r:17},AP:{s:1,n:'A 휴대폰',u:7,r:17},AT21:{s:1,n:'A 냉장고 21 탭',u:7,r:21},BB:{s:1,n:'B 브라우저',u:8,r:17},BT:{s:2,n:'B 태블릿',u:8,r:17},AT:{s:2,n:'A 태블릿',u:7,r:17}};
function world(){return {sv:[[{u:7,c:[['c1','AN']]}],[{u:7,c:[['c2','AP'],['c3','AT21']]},{u:8,c:[['c4','BB']]}],[{u:8,c:[['c5','BT']]}]],
 dev:{AN:{on:1,v:3},AP:{on:1,v:3},AT21:{on:1,v:null},BB:{on:1,v:3},BT:{on:1,v:3},AT:{on:0,v:null}},db:{7:3,8:3}}}
function maker(){const o={toks:[],sets:[],glows:[],marks:[],notes:[],caps:[],gates:[],bars:[],locks:[],end:0};const W=world();
 const b={o,W,
  tok(id,kind,path,t0,d,opt){o.toks.push(Object.assign({id,kind,path,t0,d},opt||{}));o.end=Math.max(o.end,t0+d+.5);return t0+d},
  set(t,fn){fn(W);o.sets.push({t,fn})},
  glow(id,t0,t1){o.glows.push({id,t0,t1})},
  mark(cid,t0,t1,k){o.marks.push({cid,t0,t1,k})},
  note(t0,t1,at,s,col){o.notes.push({t0,t1,at,s,col})},
  cap(t,cap,badge,col,call){o.caps.push({t,cap,badge,col,call})},
  gate(t,k){o.gates.push({t,k})},bar(t0,t1,s){o.bars.push({t0,t1,s})},lock(t0,t1,sv,u){o.locks.push({t0,t1,sv,u})}};
 return b}
/* 한 서버가 신호를 받아 처리하는 과정 */
function fan(b,t,u,lb){const W=b.W;let end=t;b.tok(lb,'by',[['red']],t,.05,{fade:1,label:lb});
 for(let i=0;i<3;i++){const id=lb+i,t1=b.tok(id,'by',[['red'],['onm',i]],t,1,{label:lb});
  b.glow('onm'+i,t1,t1+.7);b.tok(id,'ev',[['onm',i]],t1+.3,.05,{label:lb});
  const g=W.sv[i].find(x=>x.u===u),t2=t1+.7;
  if(!g){b.tok(id,'ev',[['onm',i],['maptop',i]],t2,.5,{label:lb,fade:1});b.note(t2+.5,t2+2.6,['maptop',i],`get(${u}) == null → 끝`,'ink2');end=Math.max(end,t2+2.6);continue}
  b.tok(id,'ev',[['onm',i],['key',i,u]],t2,.5,{label:lb});b.glow(`k${i}-${u}`,t2+.5,t2+1.2+g.c.length*.8);b.glow(`g${i}-${u}`,t2+.5,t2+1.2+g.c.length*.8);
  let tj=t2+.6;g.c.forEach(([cid,dv],j)=>{const ok=DEVS[dv].r===17;b.tok(id,'ev',[j?['chip',i,g.c[j-1][0]]:['key',i,u],['chip',i,cid]],tj,.45,{label:lb});
   b.mark(cid,tj+.45,tj+3.4,ok?'ok':'skip');
   if(ok){b.tok('e'+cid+lb,'sse',[['chip',i,cid],['dev',dv]],tj+.5,.6,{fade:1});const v=W.db[u];b.set(tj+1.1,w=>{w.dev[dv].v=v;w.dev[dv].hit=1});b.set(tj+2.2,w=>{w.dev[dv].hit=0})}
   tj+=.8});
  b.tok(id,'ev',[['chip',i,g.c[g.c.length-1][0]]],tj,.05,{label:lb,fade:1});end=Math.max(end,tj+1.2)}
 return end}
const TAIL=(b,t)=>{b.o.end=Math.max(b.o.end,t)};
const SCN={
 save:{name:'알림 저장',lead:'서버 1이 A·B 알림을 저장하면, 같은 신호가 서버 3대에 다 가지만 서버마다 가진 연결이 달라서 결과가 달라지는 걸 보여 줘요.',build(){
  const b=maker();
  b.cap(0,'A·B가 함께 쓰는 냉장고 17에 임박 알림이 생겨요. 연결 목록은 서버마다 달라요.','대기','ink3','');
  b.glow('SAVE',.3,1.8);b.cap(.3,'서버 1의 스케줄러 스레드가 알림과 수신자 A·B 행을 저장해요. 아직 커밋 전이에요.','서버 1 · 스케줄러 스레드','cur','generate(17) → saveRecipients(알림, [A, B])');
  b.set(.6,w=>{w.dbp=1});
  b.tok('A','ev',[['save'],['ev',0]],.9,.8,{label:'A',grow:1});b.tok('B','ev',[['save'],['ev',1]],1.1,.8,{label:'B',grow:1});
  b.glow('EVENT',1.7,3);b.note(1.9,3,['evnote'],'커밋 대기','grp-s');b.cap(1.7,'수신자마다 NotificationChanged를 발행해요. 커밋될 때까지 보관만 해요.','서버 1 · 스케줄러 스레드','cur','publishEvent(NotificationChanged(7, 17)), (8, 17)');
  b.gate(3,'ok');b.set(3.1,w=>{w.dbp=0;w.db={7:4,8:4}});b.cap(3,'커밋돼요. 이제 보관한 사건 2개가 afterCommit으로 넘어가요.','서버 1 · 스케줄러 스레드','cur','commit → afterCommit(changed)');
  b.tok('A','ev',[['ev',0],['gate'],['pub']],3.3,.7,{label:'A'});b.tok('A','by',[['pub'],['red']],4.0,.6,{label:'A'});
  b.tok('B','ev',[['ev',1],['gate'],['pub']],3.7,.7,{label:'B'});b.tok('B','by',[['pub'],['red']],4.4,.6,{label:'B'});
  b.glow('PUB',3.9,5);b.cap(4,'JSON을 바이트로 바꿔 PUBLISH 해요. 사건마다 한 번씩이에요.','서버 1 · 스케줄러 스레드','cur','convertAndSend("fridgely:notifications:changed", {"userId":7,…})');
  b.glow('RED',4.5,5.8);
  b.cap(4.7,'Redis가 구독한 서버 3대에 같은 바이트를 보내요. 각 서버의 onMessage가 받아요.','서버 1·2·3 · 리스너 실행 스레드','wrk','onMessage(message) → notifyChanged(userId, 17)');
  const e1=fan(b,4.7,7,'A'),e2=fan(b,5.1,8,'B');
  b.cap(7.2,'서버마다 자기 Map에서만 찾아요. 서버 1에는 B가 없고, 서버 3에는 A가 없어서 그 서버에서는 바로 끝나요.','서버 1·2·3 · 리스너 실행 스레드','wrk','connections.get(userId) → group.notifyChanged → accepts');
  b.cap(8.4,'서버 2의 A 냉장고 21 탭은 같은 사용자라도 냉장고가 달라서 건너뛰어요.','서버 2 · 리스너 실행 스레드','wrk','accepts: refrigeratorId 21 ≠ 17 → return');
  b.cap(Math.max(e1,e2),'연결된 화면 4곳이 이벤트를 받고 다시 조회해서 DB와 같아졌어요.','서버 1·2·3','wrk','emitter.send(notifications-changed) → 목록·미읽음 수 재조회');

 read:{name:'A만 읽음',lead:'A가 노트북(서버 1)에서 읽으면 A의 사건 하나만 나가고, 서버 2의 A 휴대폰만 따라 바뀌어요. B 화면은 그대로예요.',build(){

 card.style.left=Math.min(Math.max(8,x-c.width/2),innerWidth-c.width-8)+'px';let T=above?y-c.height-10:y+16;if(T<8)T=y+16;if(T+c.height>innerHeight-8)T=Math.max(8,y-c.height-10);card.style.top=T+'px'}
const hide=()=>card.classList.remove('on');
const capCard=()=>{const c=[...P.caps].reverse().find(x=>t>=x.t);return c&&c.call?`<b>${esc(c.call)}</b><p>${esc(c.badge||'')}</p>`:''};
document.addEventListener('pointerover',e=>{const ib=e.target.closest&&e.target.closest('.ib');if(ib){const r=ib.getBoundingClientRect();showAt(capCard(),r.left+r.width/2,r.top,1)}});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('.ib')&&!pinned)hide()});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('ib')){const r=e.target.getBoundingClientRect();showAt(capCard(),r.left+r.width/2,r.top,1)}});
document.addEventListener('focusout',hide);
$('map').addEventListener('pointermove',e=>{const g=e.target.closest('[data-id]');if(!g){if(!pinned)hide();return}showAt(cardHtml(g.dataset.id),e.clientX,e.clientY,0)});
$('map').addEventListener('pointerleave',()=>{if(!pinned)hide()});
document.addEventListener('click',e=>{const ib=e.target.closest('.ib'),g=e.target.closest('#map [data-id]');
 if(ib){pinned=ib;const r=ib.getBoundingClientRect();showAt(capCard(),r.left+r.width/2,r.top,1);return}
 if(g){pinned=g;showAt(cardHtml(g.dataset.id),e.clientX,e.clientY,0);return}pinned=null;hide()});
const QS=new URLSearchParams(location.search);if(QS.get('s')&&SCN[QS.get('s')])SC=QS.get('s');if(QS.has('embed'))document.body.classList.add('embed');
setup();
if(QS.has('embed')&&'IntersectionObserver' in window){let seen=false;playing=false;$('play').textContent='재생';new IntersectionObserver(es=>{const v=es[0].isIntersecting;if(v&&!seen){seen=true;t=0;SM={}}playing=v;$('play').textContent=v?'일시정지':'재생'},{threshold:.2}).observe(document.body)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;$('play').textContent='재생'}
window.__sim={set:v=>{playing=false;t=v;SM={};render(true)},end:()=>P.end,go:s=>{SC=s;setup()}};
requestAnimationFrame(n=>{lastT=n;requestAnimationFrame(loop)});
})();
</script>
</body>
</html>
