<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>알림 배치 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: wide workspace — scenario sidebar (steps list) on the left, full system diagram on the right */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#1a1f2b; --ink-2:#565e70; --ink-3:#8b92a1;
  --line:#dfe3ea; --line-2:#b9c0cc; --box:#eef0f4;
  --accent:#2f5bd3; --accent-bg:#e5ecfc;
  --ok:#1d7a4b; --ok-bg:#ddf1e5; --warn:#a46700; --warn-bg:#fbeecd; --bad:#c03232; --bad-bg:#fbe3e3;
  --n:#0f7a74; --n-bg:#dcf2ef; --p:#6a4bc4; --p-bg:#ebe5fa; --q:#b0601a; --q-bg:#fbeadb;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#1a1e26; --ink:#e8ebf1; --ink-2:#a8afbc; --ink-3:#6f7786;
  --line:#2a303b; --line-2:#465061; --box:#232833; --accent:#83a2f2; --accent-bg:#1e2945;
  --ok:#6fd09c; --ok-bg:#163224; --warn:#ecc06c; --warn-bg:#3a2c0f; --bad:#f28b8b; --bad-bg:#3e1b1b;
  --n:#5fd0c6; --n-bg:#123230; --p:#b49cf5; --p-bg:#2a2245; --q:#f0a868; --q-bg:#3a2715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#1a1e26; --ink:#e8ebf1; --ink-2:#a8afbc; --ink-3:#6f7786;
  --line:#2a303b; --line-2:#465061; --box:#232833; --accent:#83a2f2; --accent-bg:#1e2945;
  --ok:#6fd09c; --ok-bg:#163224; --warn:#ecc06c; --warn-bg:#3a2c0f; --bad:#f28b8b; --bad-bg:#3e1b1b;
  --n:#5fd0c6; --n-bg:#123230; --p:#b49cf5; --p-bg:#2a2245; --q:#f0a868; --q-bg:#3a2715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:600;margin:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--box)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);min-width:96px}
.tab.sel{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:500}
label{font-size:13px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:clamp(300px,20vw,400px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.info h3{font-size:15px;font-weight:600;margin:0}
.info .eb{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.info .trig{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-2)}
.info .trig b{font-weight:500;color:var(--ink);white-space:nowrap}
.info p{margin:0;font-size:14px;color:var(--ink-2)}
.info ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.info li{font-size:13px;color:var(--ink);padding:8px 10px;border-radius:8px;background:var(--box);line-height:1.5}
.info .stores{display:flex;flex-wrap:wrap;gap:6px}
.info .st{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid}
.cases{align-items:center}
.caselbl{font-size:13px;color:var(--ink-2);margin-right:4px}
.case.sel{background:var(--q-bg);border-color:var(--q);color:var(--q);font-weight:500}
#n-jPEND.s-cur .frame{fill:var(--accent-bg);stroke:var(--accent);stroke-width:3.5}
#n-jRETRY.s-cur .frame{fill:var(--q-bg);stroke:var(--q);stroke-width:3.5}
#n-jACC.s-cur .frame{fill:var(--ok-bg);stroke:var(--ok);stroke-width:3.5}
#n-jCAN.s-cur .frame{fill:var(--box);stroke:var(--ink-2);stroke-width:3.5}
#n-jFAIL.s-cur .frame{fill:var(--bad-bg);stroke:var(--bad);stroke-width:3.5}
.chk rect{fill:var(--panel);stroke:var(--line);transition:fill .3s,stroke .3s}
.chk.ing rect{fill:var(--warn-bg);stroke:var(--warn)} .chk.ok rect{fill:var(--ok-bg);stroke:var(--ok)} .chk.bad rect{fill:var(--bad-bg);stroke:var(--bad)}
.chk .mk{font-size:12px;font-weight:600;text-anchor:end;fill:var(--ink-3)}
.chk.ok .mk{fill:var(--ok)} .chk.bad .mk{fill:var(--bad)} .chk.ing .mk{fill:var(--warn)}
.jp-l{font-size:12px;fill:var(--ink-2);text-anchor:start} .jp-v{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:end;font-variant-numeric:tabular-nums}
.jp-v.flash{fill:var(--accent)}
.flowline{display:flex;flex-direction:column;gap:2px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);line-height:1.5}
.flowline .tr{color:var(--ink-3)} .flowline .tr b{font-weight:600;color:var(--ink)}
.stepbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;border:1.5px solid var(--accent);background:var(--panel)}
.stepbox .who{font-size:12px;font-weight:600;color:var(--accent)}
.stepbox .what{font-size:14px;color:var(--ink);line-height:1.6}
.stepbox .data{font-size:12px;color:var(--ink-2);padding:6px 8px;border-radius:6px;background:var(--box)}
.stepbox .data b{font-weight:600;color:var(--ink)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flow li{display:grid;grid-template-columns:18px 1fr;gap:4px;font-size:14px;line-height:1.55;color:var(--ink)}
.flow li::before{content:"→";color:var(--accent);font-weight:600}
.stepbox.idle .flow li::before{color:var(--ink-3)}
.stepbox.idle{border-style:dashed;border-color:var(--line-2)} .stepbox.idle .what{color:var(--ink-3)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
.log li{font-size:12px;color:var(--ink-2);display:grid;grid-template-columns:44px 1fr;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);background:none;border-radius:0}
.log li i{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.log li.new{color:var(--ink)}
.st.n{color:var(--n);background:var(--n-bg);border-color:var(--n)} .st.p{color:var(--p);background:var(--p-bg);border-color:var(--p)} .st.q{color:var(--q);background:var(--q-bg);border-color:var(--q)}
.now{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--accent-bg);min-height:96px}
.now .k{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:500}
.now .c{font-size:17px;font-weight:600;color:var(--ink);text-wrap:balance}
.now .s{font-size:13px;color:var(--ink-2)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.list li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13px;color:var(--ink-3);padding:6px 8px;border-radius:8px;transition:background .3s,color .3s}
ol.list li{cursor:pointer}
ol.list li:hover{background:var(--box);color:var(--ink)}
ol.list li:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ol.list li.on:hover{background:var(--accent-bg);color:var(--accent)}
ol.list li b{font-weight:500;font-variant-numeric:tabular-nums}
ol.list li.done{color:var(--ink-2)}
ol.list li.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto;min-width:0}
svg{display:block;width:100%;min-width:900px;height:auto;max-height:calc(100vh - 220px)}
body{word-break:keep-all}
svg text{font-family:var(--f-body);dominant-baseline:central}
.node{transition:opacity .4s}
.node .frame{fill:var(--panel);stroke:var(--line-2);stroke-width:1.3;transition:fill .3s,stroke .3s,stroke-width .3s}
.node.on .frame{stroke:var(--accent);stroke-width:2.6;fill:var(--accent-bg)}
.node.dash .frame{stroke-dasharray:7 5}
.t1{font-size:14px;font-weight:600;fill:var(--ink);text-anchor:middle}
.t2{font-size:12px;fill:var(--ink-2);text-anchor:middle}
.mono{font-size:12.5px;font-weight:500;fill:var(--ink)}
.dim{opacity:.18}
[hidden]{display:none!important}
.cyl .body{stroke-width:1.5;transition:stroke-width .3s}
.cyl.on .body{stroke-width:3}
.db-n .body{fill:var(--n-bg);stroke:var(--n)} .db-n .dbt{fill:var(--n)}
.db-p .body{fill:var(--p-bg);stroke:var(--p)} .db-p .dbt{fill:var(--p)}
.db-q .body{fill:var(--q-bg);stroke:var(--q)} .db-q .dbt{fill:var(--q)}
.dbt{font-size:12px;font-weight:600;text-anchor:middle}
.trow rect{fill:var(--panel);stroke:var(--line);transition:fill .3s}
.trow.flash rect{fill:var(--warn-bg);stroke:var(--warn)}
.cnt{font-size:12px;font-weight:600;fill:var(--ink);text-anchor:end;font-variant-numeric:tabular-nums}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-linejoin:round;transition:stroke .3s,stroke-width .3s,opacity .4s}
.edge.dash{stroke-dasharray:7 6}
.edge.on{stroke:var(--accent);stroke-width:3}
.tag{opacity:0;transition:opacity .3s;pointer-events:none}
.tag.show{opacity:1}
.tag rect{fill:var(--ink)} .tag text{fill:var(--panel);font-size:12px;font-weight:500;text-anchor:middle}
.pk{stroke:var(--panel);stroke-width:2.5}
.pk.go{fill:var(--accent)} .pk.back{fill:var(--ok)} .pk.ext{fill:var(--q)}
.mini{fill:var(--box);stroke:var(--line-2);transition:fill .3s,stroke .3s}
.mini.run{fill:var(--accent-bg);stroke:var(--accent)} .mini.ok{fill:var(--ok-bg);stroke:var(--ok)} .mini.wait{fill:var(--warn-bg);stroke:var(--warn)}
.mini.bad{fill:var(--bad-bg);stroke:var(--bad)} .mini.retry{fill:var(--q-bg);stroke:var(--q);stroke-dasharray:4 3}
.lane{opacity:0;transition:opacity .4s}
.lane.in{opacity:1;animation:slidein .6s ease-out}
@keyframes slidein{0%{transform:translateX(-24px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.lane.in{animation:none}}
.tok{fill:var(--panel);stroke:var(--accent);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .4s,fill .3s}
.tok.show{opacity:1} .tok.used{fill:var(--accent)}
.tok.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.7)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tok.pop{animation:none}}
.mini.pick{stroke:var(--accent);stroke-width:2.5}
.pk.bad{fill:var(--bad)}
.mtxt{font-size:11px;fill:var(--ink-2);text-anchor:middle}
.bar{fill:var(--accent);transform-box:fill-box;transform-origin:left center}
.ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:10 8;opacity:0;transform-box:fill-box;transform-origin:center}
.ring.spin{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qmark{font-size:22px;font-weight:600;fill:var(--warn);text-anchor:middle;opacity:0;transition:opacity .3s}
.qmark.show{opacity:1;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);padding:4px 6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;border:1.5px solid}
.dot{width:10px;height:10px;border-radius:50%}
@media (prefers-reduced-motion:reduce){.ring.spin,.qmark.show{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <h1>알림 배치 시뮬레이터</h1>
    <span class="sp"></span>
    <button id="play" class="primary" onclick="onPlay()">재생</button>
    <button onclick="onNext()">다음 단계</button>
    <button onclick="restart()">처음부터</button>
    <label for="speed">속도</label>
    <select id="speed" onchange="speed=+this.value">
      <option value="0.5">아주 느리게</option>
      <option value="1" selected>느리게</option>
      <option value="1.6">보통</option>
      <option value="2.5">빠르게</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tabs cases" id="cases" hidden><span class="caselbl">경우 선택</span></div>
  <div class="grid">
    <aside class="side">
      <div class="card">
        <div class="now" aria-live="polite"><span class="k" id="nowk">대기 중</span><span class="c" id="nowc">시나리오를 고르고 재생을 눌러</span></div>
        <div class="stepbox idle" id="whatbox"><span class="who">지금 하는 일</span><span class="what" id="nows"></span></div>
        <div class="flowline" id="info"></div>
        <ol class="list" id="list"></ol>
      </div>
    </aside>
    <div class="canvas">
      <svg id="svg" viewBox="0 0 1200 860" role="img" aria-label="알림 시스템 전체 구성도 애니메이션">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <g id="edges"></g><g id="nodes"></g><g id="pk"></g><g id="tags"></g>
      </svg>
      <svg id="svgJob" viewBox="0 0 1200 600" role="img" aria-label="푸시 발송 작업 한 건의 상태 변화 애니메이션" hidden>
        <defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <g id="edgesJ"></g><g id="nodesJ"></g><g id="pkJ"></g><g id="tagsJ"></g>
      </svg>
      <div class="legend" id="legendJob" hidden>
        <span><i class="sw" style="background:var(--accent-bg);border-color:var(--accent)"></i>첫 발송 대기</span>
        <span><i class="sw" style="background:var(--q-bg);border-color:var(--q)"></i>재시도 대기</span>
        <span><i class="sw" style="background:var(--ok-bg);border-color:var(--ok)"></i>수락</span>
        <span><i class="sw" style="background:var(--box);border-color:var(--ink-2)"></i>취소</span>
        <span><i class="sw" style="background:var(--bad-bg);border-color:var(--bad)"></i>최종 실패</span>
        <span>굵은 테두리 = 지금 작업이 있는 상태</span>
      </div>
      <div class="legend" id="legendMain">
        <span><i class="sw" style="background:var(--n-bg);border-color:var(--n)"></i>알림 저장소</span>
        <span><i class="sw" style="background:var(--p-bg);border-color:var(--p)"></i>설정·기기 저장소</span>
        <span><i class="sw" style="background:var(--q-bg);border-color:var(--q)"></i>푸시 작업 저장소</span>
        <span><i class="dot" style="background:var(--accent)"></i>요청·데이터 이동</span>
        <span><i class="dot" style="background:var(--ok)"></i>응답·결과</span>
        <span><i class="dot" style="background:var(--q)"></i>외부 호출</span>
        <span><i class="sw" style="border-color:var(--ink-3);border-style:dashed"></i>V2 계획(미정)</span>
      </div>
    </div>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,cls,extra){const t=el('text',Object.assign({x,y,class:cls},extra||{}),p);t.textContent=s;return t}
const NODES=$('nodes'),EDGES=$('edges'),PK=$('pk'),TAGS=$('tags');
const N={};
function box(id,x,y,w,h,lines,o={}){const g=el('g',{class:'node'+(o.dash?' dash':''),id:'n-'+id},o.parent||NODES);
  el('rect',{class:'frame',x,y,width:w,height:h,rx:12},g);
  let ty=y+(o.top||24);lines.forEach((s,i)=>{txt(g,x+w/2+(o.dx||0),ty,s,i===0?'t1':'t2');ty+=i===0?20:17});
  N[id]={g,x,y,w,h};return g}
function cyl(id,x,y,w,h,label,cls){const ry=14,g=el('g',{class:'node cyl '+cls,id:'n-'+id},NODES);
  el('path',{class:'body',d:`M${x} ${y+ry} V${y+h-ry} A${w/2} ${ry} 0 0 0 ${x+w} ${y+h-ry} V${y+ry}`},g);
  el('ellipse',{class:'body',cx:x+w/2,cy:y+ry,rx:w/2,ry},g);
  txt(g,x+w/2,y+ry+26,label,'dbt');N[id]={g,x,y,w,h};return g}
function trow(g,x,y,w,name){const r=el('g',{class:'trow'},g);el('rect',{x,y,width:w,height:28,rx:6},r);
  txt(r,x+10,y+14,name,'mono');const c=txt(r,x+w-10,y+14,'','cnt');return{r,c}}
function clockIcon(g,cx,cy){el('circle',{cx,cy,r:15,fill:'var(--panel)',stroke:'var(--ink-2)','stroke-width':2},g);
  el('line',{x1:cx,y1:cy,x2:cx,y2:cy-9,stroke:'var(--ink)','stroke-width':2.2,'stroke-linecap':'round'},g);
  el('line',{x1:cx,y1:cy,x2:cx+7,y2:cy,stroke:'var(--ink)','stroke-width':2.2,'stroke-linecap':'round'},g);
  return el('circle',{class:'ring',cx,cy,r:22},g)}

/* ---- user screen ---- */
(function(){const x=40,y=200,w=170,h=150,g=el('g',{class:'node',id:'n-U'},NODES);
  el('rect',{class:'frame',x,y,width:w,height:h,rx:12},g);
  el('rect',{x:x+1,y:y+1,width:w-2,height:30,rx:11,fill:'var(--box)'},g);
  txt(g,x+14,y+16,'사용자 화면','t1',{'text-anchor':'start','style':'text-anchor:start'});
  el('circle',{cx:x+w-22,cy:y+16,r:10,fill:'var(--accent)'},g);
  N.badge=txt(g,x+w-22,y+16,'2','t2',{style:'fill:var(--panel);font-weight:600;font-size:11px'});
  N.list=el('g',{},g);N.U={g,x,y,w,h}})();
let items=[];
function renderU(){N.list.innerHTML='';const x=40,y=200;items.slice(-3).reverse().forEach((it,i)=>{const yy=y+40+i*34;
  const r=el('rect',{x:x+10,y:yy,width:150,height:28,rx:6,fill:it.fresh?'var(--accent-bg)':'var(--box)'},N.list);
  if(it.unread)el('circle',{cx:x+22,cy:yy+14,r:4,fill:'var(--accent)'},N.list);
  txt(N.list,x+34,yy+14,it.t,'t2',{style:'text-anchor:start;fill:var(--ink)'})});
  N.badge.textContent=items.filter(i=>i.unread).length}

/* ---- nodes ---- */

function vtime(ms,cb,t){if(t.fast){if(!t.dead&&cb)cb(1);return Promise.resolve(!t.dead)}return new Promise(res=>{let e=0,last=performance.now();
  (function f(now){if(t.dead)return res(false);const dt=Math.min(now-last,100);last=now;e+=dt*(t.fast?400:(paused?0:speed/(t.mul||1)));const k=Math.min(e/ms,1);cb&&cb(k);if(k<1)requestAnimationFrame(f);else res(true)})(last)})}
const wait=(ms,t)=>vtime(ms,null,t);
function fly(id,ms,cls,t,rev){const P=rev?[...E[id].pts].reverse():E[id].pts;const c=el('circle',{r:9,class:'pk '+(cls||'go'),cx:P[0][0],cy:P[0][1]},E[id].pk);
  const seg=[];let tot=0;for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);seg.push(d);tot+=d}
  return vtime(ms,k=>{let d=k*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++}const r=seg[i]?Math.min(d/seg[i],1):1;
    c.setAttribute('cx',P[i][0]+(P[i+1][0]-P[i][0])*r);c.setAttribute('cy',P[i][1]+(P[i+1][1]-P[i][1])*r)},t).then(v=>{c.remove();return v})}

  pts:['참여 변경, 응답, 알림 생성의 순서와 트랜잭션 경계를 정해야 해. 참여 저장 후, 알림 저장 후, 푸시 발송 후 중 언제 응답할지가 핵심이야.',
   '누구에게, 언제 알림을 만들지 아직 미정이야.','지속 연결을 택하면 알림이 생긴 서버와 사용자가 연결된 서버가 다를 수 있어. 두 서버 사이 전달 방법이 필요해.']},
 all:{t:'전체 흐름',trig:'다섯 가지 계기',sum:'사용자 요청, 폴링, 08시 배치, 03시 정리, V2 계획을 차례로 이어서 보여줘. 재생 중에는 지금 흐름의 설명으로 바뀌어.',
  st:[['n','notifications'],['p','notification_preferences'],['q','push_notifications']],
  pts:['사용자 요청과 폴링은 사용자가 시작하고, 08시·03시 배치는 시각이 시작해.','세 저장소는 색으로 구분돼. 초록은 알림, 보라는 설정·기기, 주황은 푸시 작업이야.']}
};
function renderInfo(k){const d=INFO[k],box=$('info');box.innerHTML='';
  const tr=document.createElement('span');tr.className='tr';
  const b=document.createElement('b');b.textContent=(cur==='all'?d.t+' · ':'')+'실행 계기 ';tr.appendChild(b);tr.appendChild(document.createTextNode(d.trig));box.appendChild(tr);
  const p=document.createElement('span');p.textContent=d.sum;box.appendChild(p)}

/* ---- UI ---- */
let cur='batch';
const tabs=$('tabs');['batch','job','req','poll','clean','v2','all'].forEach(k=>{const b=document.createElement('button');b.className='tab';b.id='tab-'+k;b.textContent=SC[k].name;b.onclick=()=>select(k);tabs.appendChild(b)});
Object.keys(CASES).forEach(k=>{const b=document.createElement('button');b.className='case';b.id='case-'+k;b.textContent=CASES[k].name;
  b.onclick=()=>{curCase=k;select('job')};$('cases').appendChild(b)});
function renderList(i){const L=$('list');L.innerHTML='';SC[cur].steps.forEach((s,j)=>{const li=document.createElement('li');li.className=j<i?'done':j===i?'on':'';
  li.innerHTML='<b>'+(j+1)+'</b><span></span>';li.lastChild.textContent=s.c;li.tabIndex=0;li.title='여기서부터 재생';
  li.onclick=()=>play(j);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(j)}};L.appendChild(li)});
  const on=L.children[i];if(on&&cur==='all')on.scrollIntoView({block:'nearest'})}
function setNow(i){const s=SC[cur].steps[i],n=SC[cur].steps.length;
  $('nowk').textContent=(cur==='all'?SC[s.sc].name+' · ':'')+(i+1)+' / '+n;$('nowc').textContent=s.c;setWhat(s.d||s.s||'');$('whatbox').classList.remove('idle')}
function setWhat(text){const box=$('nows');box.innerHTML='';const ul=document.createElement('ul');ul.className='flow';
  text.split(/(?<=[.?])\s+/).filter(Boolean).forEach(line=>{const li=document.createElement('li');li.textContent=line;ul.appendChild(li)});box.appendChild(ul)}
function btn(){$('play').textContent=running&&!paused&&!manual?'일시정지':'재생'}
function select(k){cur=k;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('sel',b.id==='tab-'+k));stop();
  const job=k==='job';if(job)buildJob();$('svg').toggleAttribute('hidden',job);$('legendMain').hidden=job;$('svgJob').toggleAttribute('hidden',!job);$('legendJob').hidden=!job;$('cases').hidden=!job;
  document.querySelectorAll('.case').forEach(b=>b.classList.toggle('sel',b.id==='case-'+curCase));
  dimTo(k==='all'?null:k);renderInfo(k);renderList(-1);$('nowk').textContent=SC[k].name+' · '+SC[k].steps.length+'단계';$('nowc').textContent='재생을 누르면 시작해';setWhat('재생하면 단계마다 여기서 무슨 일이 일어나는지 알려줘. 다음 단계 버튼으로 한 칸씩 볼 수도 있어.');$('whatbox').classList.add('idle')}
function stop(){tok.dead=true;running=false;paused=false;release=null;resetState();hl(null);btn()}
function gate(t){return new Promise(res=>{release=()=>{release=null;res()};if(!manual)wait(1400,t).then(()=>{if(release)release()})})}
async function play(start=0){stop();const t={dead:false,fast:start>0};tok=t;running=true;btn();const steps=SC[cur].steps;
  for(let i=0;i<steps.length;i++){if(i===start)t.fast=false;if(i>start){await gate(t);if(t.dead)return}
    const s=steps[i];if(cur==='all'){dimTo(s.sc);if(i===0||steps[i-1].sc!==s.sc)renderInfo(s.sc)}if(i>=start){setNow(i);renderList(i);hl(s)}const t0=performance.now();await s.run(t);
    if(!t.dead&&!t.fast&&s.sc==='job'){const v=(performance.now()-t0)*speed;if(v<4800)await wait(4800-v,t)}if(t.dead)return}
  running=false;btn();renderList(steps.length);$('nowk').textContent=SC[cur].name+' · 끝';$('nows').textContent='다시 보려면 재생을 눌러'}
function onPlay(){if(!running){manual=false;paused=false;play();return}
  if(paused||manual){paused=false;manual=false;if(release)release()}else paused=true;btn()}
function onNext(){manual=true;paused=false;if(!running)play();else if(release)release();btn()}
function restart(){select(cur)}
resetState();select('batch');
</script>

</html>
